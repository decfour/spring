<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Don't Sell - 채팅방 테스트</title>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
</head>
<body>
    <a href="/">홈으로</a>
    <a id="sign-in-link" href="/sign-in.html">로그인</a>
    <button id="sign-out-button" type="button" hidden>로그아웃</button>
    <p id="auth-status" role="status"></p>
    <h1>AAPL 채팅방</h1>

    <tv-advanced-chart
        symbol="NASDAQ:AAPL"
        interval="15"
        style="display: block; width: 100%; height: 450px;">
    </tv-advanced-chart>

    <h2>채팅</h2>

    <label for="message">메시지</label>
    <input id="message" type="text" maxlength="1000" placeholder="메시지 입력">
    <button type="button" disabled>전송 (구현 예정)</button>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
