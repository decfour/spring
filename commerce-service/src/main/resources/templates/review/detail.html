<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'THGTE - ' + ${review?.title}">THGTE - Review Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            overflow: hidden;
        }

        .post-title-sub {
            font-size: 1.5rem;
            font-weight: 500;
            color: #86868b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 450px;
        }

        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .dropdown-toggle-icon {
            background: none;
            border: none;
            color: #86868b;
            font-size: 1.1rem;
            padding: 2px 10px;
            height: 38px;
            border-radius: 980px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .dropdown-toggle-icon:hover {
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .dropdown-menu-apple {
            border-radius: 12px;
            border: 1px solid #e5e5e7;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            padding: 6px;
            min-width: 130px;
            z-index: 1050;
        }

        .dropdown-menu-apple .dropdown-item {
            font-size: 0.85rem;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .dropdown-menu-apple .dropdown-item.text-danger:hover {
            background-color: #fff2f2;
        }

        .dropdown-menu-apple .dropdown-item:hover {
            color: #0066cc;
            background-color: #f5f5f7;
        }

        .post-info-flat {
            padding: 0 4px 16px 4px;
            margin-bottom: 8px;
        }

        .post-info-row {
            display: flex;
            align-items: center;
        }

        .post-user-meta {
            color: #86868b;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .meta-divider {
            color: #d2d2d7;
            margin: 0 6px;
            font-size: 0.75rem;
        }

        .post-card {
            padding: 20px;
            border: 1px solid #d2d2d7;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            color: #1d1d1f;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 180px;
            margin-bottom: 32px;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            <span>Review</span>
            <span class="post-title-sub" th:text="${review?.title}">제목</span>
        </h2>

        <div class="d-flex gap-2 align-items-center">
            <div class="dropdown"
                 th:if="${member != null and (
                     (review?.member != null and review.member.id == member.id) or
                     (member.memberType != null and member.memberType.name() == 'ADMIN')
                 )}">
                <button class="dropdown-toggle-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-apple">
                    <li>
                        <a class="dropdown-item" th:href="@{/shop/item/{itemId}/review/{reviewId}/edit(itemId=${itemId}, reviewId=${review.id})}">수정</a>
                    </li>
                    <li>
                        <form th:action="@{/shop/item/{itemId}/review/{reviewId}/delete(itemId=${itemId}, reviewId=${review.id})}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>

            <a th:href="@{/shop/item/{itemId}/review(itemId=${itemId})}" class="btn-apple-outline">뒤로</a>
        </div>
    </div>

    <div class="post-info-flat">
        <div class="post-info-row">
            <span class="post-user-meta">
                작성자 <span class="text-dark font-weight-bold" th:text="${review?.member != null ? review.member.username : '익명'}">사용자</span>
                <span class="meta-divider">•</span>
                <span th:text="${#temporals.format(review?.createdDate, 'yyyy.MM.dd HH:mm')}">2026.08.17 21:28</span>
            </span>
        </div>
    </div>

    <div class="post-card" th:text="${review?.content}">
        내용
    </div>

</div>

</body>
</html>
