<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'THGTE - ' + ${review?.title}">THGTE - Review Detail</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body data-view="review-detail">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            <span>Review</span>
            <span class="detail-title" th:text="${review?.title}">제목</span>
        </h2>

        <div class="d-flex gap-2 align-items-center">
            <div class="dropdown"
                 th:if="${member != null and (
                     (review?.creator != null and review.creator.id == member.id) or
                     (member.memberType != null and member.memberType.name() == 'ADMIN')
                 )}">
                <button class="btn-menu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end menu">
                    <li>
                        <a class="dropdown-item" th:href="@{/shop/item/{itemId}/review/{reviewId}/edit(itemId=${itemId}, reviewId=${review.id})}">수정</a>
                    </li>
                    <li>
                        <form th:action="@{/shop/item/{itemId}/review/{reviewId}/delete(itemId=${itemId}, reviewId=${review.id})}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>

            <a th:href="@{/shop/item/{itemId}/review(itemId=${itemId})}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div class="detail-meta">
        <div class="post-info-row">
            <span class="author-meta">
                작성자 <span class="text-dark font-weight-bold" th:text="${review?.creator != null ? review.creator.name : '익명'}">사용자</span>
                <span class="meta-divider">•</span>
                <span th:text="${#temporals.format(review?.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.17 21:28</span>
            </span>
        </div>
    </div>

    <div class="surface-card post-card" th:text="${review?.content}">
        내용
    </div>

</div>

</body>
</html>
