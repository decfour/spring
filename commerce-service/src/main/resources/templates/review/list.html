<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Review</title>
    <th:block th:replace="~{shop/components :: styles}"></th:block>
</head>
<body class="theme shop-page" data-view="review-list">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">
    <div class="page-head">
        <h2 class="page-title m-0">Shop <span class="subtitle">Review</span></h2>
        <div class="d-flex gap-2">
            <a th:href="@{/shop/item/{itemId}/review/add(itemId=${itemId})}" class="btn-action">등록</a>
            <a th:href="@{/shop/item/{itemId}(itemId=${itemId})}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div th:if="${reviews.isEmpty()}" class="panel text-center">
        후기가 없습니다
    </div>

    <div th:if="${not reviews.isEmpty()}" class="course-list">
        <a th:each="review : ${reviews}"
           th:href="@{/shop/item/{itemId}/review/{reviewId}(itemId=${itemId}, reviewId=${review.id})}"
           class="panel entry-link d-flex justify-content-between align-items-center gap-3">
            <span class="text-break" th:text="${review.title}">제목</span>
            <time class="entry-date text-nowrap" th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd')}">2026.06.29</time>
        </a>
    </div>

    <div th:replace="~{common/pagination :: pager(${reviews}, @{/shop/item/{itemId}/review(itemId=${itemId})})}"></div>
</div>

</body>
</html>
