<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .btn-apple-dark,
        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
        }

        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: 1px solid #1d1d1f;
        }

        .btn-apple-dark:hover {
            background-color: #434344;
            border-color: #434344;
            color: #ffffff;
        }

        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .review-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .review-table th {
            padding: 12px 16px;
            font-weight: 500;
            color: #86868b;
            font-size: 0.85rem;
            border-bottom: 1px solid #d2d2d7;
        }

        .review-table td {
            padding: 16px;
            border-bottom: 1px solid #e5e5e7;
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .review-row {
            transition: background-color 0.2s ease;
        }

        .review-table tbody tr.review-row:hover {
            background-color: #f5f5f7;
        }

        .review-link {
            display: block;
            color: #1d1d1f;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: -0.2px;
            transition: color 0.2s ease;
        }

        .review-link:hover {
            color: #0066cc;
        }

        .review-date {
            color: #86868b;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: right;
        }

        .empty-review {
            padding: 40px 20px;
            text-align: center;
            color: #86868b;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
            margin-top: 12px;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 28px;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1d1d1f;
            background-color: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.15s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        .page-btn:hover:not(.active):not(.disabled) {
            background-color: #f5f5f7;
            border-color: #d2d2d7;
            color: #1d1d1f;
        }

        .page-btn.active {
            background-color: #1d1d1f;
            color: #ffffff;
            font-weight: 600;
        }

        .page-btn.disabled {
            color: #d2d2d7;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">Review</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/shop/item/{itemId}/review/add(itemId=${itemId})}" class="btn-apple-dark">작성</a>
            <a th:href="@{/shop/item/{itemId}(itemId=${itemId})}" class="btn-apple-outline">뒤로</a>
        </div>
    </div>

    <div th:if="${reviews.isEmpty()}" class="empty-review">
        후기가 없습니다
    </div>

    <table th:if="${not reviews.isEmpty()}" class="review-table">
        <thead>
        <tr>
            <th style="width: 75%; text-align: left;">Title</th>
            <th style="width: 25%; text-align: right;">Date</th>
        </tr>
        </thead>
        <tbody>
        <tr class="review-row" th:each="review : ${reviews}">
            <td>
                <a th:href="@{/shop/item/{itemId}/review/{reviewId}(itemId=${itemId}, reviewId=${review.id})}" class="review-link" th:text="${review.title}">
                    제목
                </a>
            </td>
            <td class="review-date" th:text="${#temporals.format(review.createdDate, 'yyyy.MM.dd')}">
                2026.06.29
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${reviews.totalPages > 1}" class="pagination-container">
        <a th:href="@{/shop/item/{itemId}/review(itemId=${itemId}, page=${reviews.number - 1})}"
           class="page-btn"
           th:classappend="${reviews.first} ? 'disabled' : ''">‹</a>

        <th:block th:each="pageNumber : ${#numbers.sequence(0, reviews.totalPages - 1)}">
            <a th:href="@{/shop/item/{itemId}/review(itemId=${itemId}, page=${pageNumber})}"
               th:text="${pageNumber + 1}"
               class="page-btn"
               th:classappend="${pageNumber == reviews.number} ? 'active' : ''">1</a>
        </th:block>

        <a th:href="@{/shop/item/{itemId}/review(itemId=${itemId}, page=${reviews.number + 1})}"
           class="page-btn"
           th:classappend="${reviews.last} ? 'disabled' : ''">›</a>
    </div>
</div>

</body>
</html>
