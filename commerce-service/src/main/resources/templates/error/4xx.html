<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - 4xx Error</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>
<body data-view="error-4xx">
<div th:replace="~{common/header :: mainHeader}"></div>

<div class="error-container">
    <div class="error-code">⚠️</div>
    <div class="error-message" th:text="${errorMessage}">잘못된 요청입니다</div>
    <a href="/" class="btn-action">돌아가기</a>
</div>

</body>
</html>
