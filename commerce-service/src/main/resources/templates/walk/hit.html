<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Walk Hit</title>

    <th:block th:replace="~{walk/fragments :: styles}"></th:block>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body class="theme walk-page" data-view="walk-hit">
    <div th:replace="~{common/header :: mainHeader}"></div>

    <div class="page">
        <div class="page-head">
            <h2 class="page-title m-0">
                Walking <span class="subtitle">Hit</span>
            </h2>

            <div class="d-flex gap-2">
                <a th:href="@{/walk}" class="btn-action">뒤로</a>
            </div>
        </div>

        <div th:replace="~{walk/fragments :: map(
            message='평균 별점 기준 상위 30개 산책 코스', showLocation=false, showDetails=false
        )}"></div>

        <div class="course-section">
            <div th:if="${courses == null or courses.isEmpty()}" class="course-empty">
                추천 산책 코스가 없습니다.
            </div>

            <div th:if="${courses != null and !courses.isEmpty()}" id="courseList" class="entry-list">
                <div th:each="course, iterStat : ${courses}"
                     class="course-card"
                     th:data-id="${course.id}"
                     th:data-route="${course.routeData}"
                     th:data-lat="${course.startLat}"
                     th:data-lng="${course.startLng}">

                    <div class="course-rank" th:text="${courses.number * courses.size + iterStat.count}">1</div>

                    <div class="course-body">
                        <div class="course-name">
                            <a th:href="@{/walk/course/{id}(id=${course.id})}"
                               title="코스 상세보기"
                               class="course-link"
                               onclick="event.stopPropagation();">
                                <span class="course-title" th:text="${course.title}">코스 이름</span>
                                <span class="course-arrow" aria-hidden="true">↗</span>
                            </a>
                        </div>

                        <div class="course-meta">
                            <span th:text="${course.distance >= 1000
                                ? #numbers.formatDecimal(course.distance / 1000.0, 1, 1) + ' km'
                                : course.distance + ' m'}">
                                0 m
                            </span>

                            <span>•</span>

                            <span class="course-rating" aria-live="polite">
                                <span th:text="${course.ratingCount > 0
                                    ? '★ ' + #numbers.formatDecimal(course.averageRating, 1, 1) + ' · 평가 ' + course.ratingCount + '명'
                                    : '아직 평가 없음'}"></span>
                            </span>
                        </div>
                    </div>

                    <div class="course-actions">
                        <a th:href="@{/walk/course/{id}/chat(id=${course.id})}"
                           onclick="event.stopPropagation();"
                           class="btn-circle course-chat"
                           title="코스 채팅 홈"
                           aria-label="코스 채팅 홈">
                            <svg width="14" height="14" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <use th:href="@{/images/icons/chat.svg#chat}"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <div th:replace="~{common/pagination :: pager(${courses}, @{/walk/course/hit})}"></div>
        </div>
    </div>

    <script th:src="@{/js/walk-hit.js}"></script>
</body>
</html>
