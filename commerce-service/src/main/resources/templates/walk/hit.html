<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Walk Hit</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body data-view="walk-hit">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            Walking <span class="subtitle">Hit</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/walk}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div class="map-wrapper">
        <div class="map-status-badge" id="status">
            🔥 추천수가 높은 코스
        </div>

        <div id="map" class="map-card"></div>
    </div>

    <div class="course-section">
        <div th:if="${courses == null or courses.isEmpty()}" class="course-empty">
            추천 산책 코스가 없습니다.
        </div>

        <div th:if="${courses != null and !courses.isEmpty()}" id="courseList" class="course-list">

            <div th:each="course, iterStat : ${courses}"
                 class="surface-card course-card"
                 th:data-id="${course.id}"
                 th:data-route="${course.routeData}"
                 th:data-lat="${course.startLat}"
                 th:data-lng="${course.startLng}">

                <th:block th:with="rank=${courses.number * courses.size + iterStat.count}">
                    <div class="course-rank"
                         th:classappend="${rank == 1 ? 'gold' : (rank == 2 ? 'silver' : (rank == 3 ? 'bronze' : ''))}"
                         th:text="${rank}">
                        1
                    </div>
                </th:block>

                <div class="course-content">
                    <div class="course-name">
                        <a th:href="@{/walk/course/{id}(id=${course.id})}"
                           title="코스 상세보기"
                           class="course-detail-link"
                           onclick="event.stopPropagation();">
                            <span class="course-title-text" th:text="${course.title}">코스 이름</span>
                            <span class="course-detail-arrow" aria-hidden="true">↗</span>
                        </a>
                    </div>

                    <div class="course-info">
                        <span th:text="${course.distance >= 1000 ? #numbers.formatDecimal(course.distance / 1000.0, 1, 1) + ' km' : course.distance + ' m'}">
                            0 m
                        </span>

                        <span>•</span>

                        <span class="course-like-total" aria-live="polite">추천 <span class="like-num" th:text="${course.likeCount ?: 0}">0</span></span>
                    </div>
                </div>
            <div class="course-actions">
                <button type="button" class="btn-circle course-like-button" th:data-id="${course.id}" onclick="likeCourse(event, this)" title="코스 추천" aria-label="코스 추천"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
                <a th:href="@{/walk/course/{id}/chat(id=${course.id})}" onclick="event.stopPropagation();" class="btn-circle course-chat-link" title="코스 채팅 홈" aria-label="코스 채팅 홈"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 11h8M8 15h5"/></svg></a>
            </div>
            </div>

        </div>
        <div th:if="${courses != null and courses.totalPages > 1}" class="pager"
             th:with="endPage=${T(java.lang.Math).min(T(java.lang.Math).max(0, courses.number - 2) + 4, courses.totalPages - 1)},
                      startPage=${T(java.lang.Math).max(0, endPage - 4)}">

            <button type="button" class="btn-page"
                    th:data-url="@{/walk/course/hit(page=${courses.number - 1})}"
                    onclick="location.href = this.dataset.url"
                    th:disabled="${courses.first}">
                ‹
            </button>

            <th:block th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}">
                <button type="button" class="btn-page"
                        th:data-url="@{/walk/course/hit(page=${pageNumber})}"
                        onclick="if (!this.classList.contains('active')) location.href = this.dataset.url"
                        th:text="${pageNumber + 1}"
                        th:classappend="${pageNumber == courses.number} ? 'active' : ''">
                    1
                </button>
            </th:block>

            <button type="button" class="btn-page"
                    th:data-url="@{/walk/course/hit(page=${courses.number + 1})}"
                    onclick="location.href = this.dataset.url"
                    th:disabled="${courses.last}">
                ›
            </button>
        </div>
    </div>

</div>

<script>
    const map = new kakao.maps.Map(
        document.getElementById('map'),
        {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 3
        }
    );

    let currentMarker = null;
    let currentRoute = null;

    document.querySelectorAll('.course-card').forEach(card => {
        card.addEventListener('click', function() {
            document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));
            this.classList.add('selected');
            showCourseOnMap(this);
        });
    });

    function showCourseOnMap(card) {
        try {
            const routeData = JSON.parse(card.dataset.route);
            const startLat = parseFloat(card.dataset.lat);
            const startLng = parseFloat(card.dataset.lng);
            const startPosition = new kakao.maps.LatLng(startLat, startLng);

            map.setCenter(startPosition);

            if (currentRoute) {
                currentRoute.setMap(null);
            }

            if (currentMarker) {
                currentMarker.setMap(null);
            }

            currentMarker = new kakao.maps.Marker({
                position: startPosition,
                map: map
            });

            const path = routeData.map(point => new kakao.maps.LatLng(point[1], point[0]));

            currentRoute = new kakao.maps.Polyline({
                path: path,
                strokeWeight: 5,
                strokeColor: '#1d1d1f',
                strokeOpacity: 0.85,
                strokeStyle: 'solid'
            });

            currentRoute.setMap(map);
        } catch (e) {
            console.error('코스 데이터 파싱 실패:', e);
        }
    }

    function likeCourse(event, btn) {
        event.stopPropagation();
        const courseId = btn.dataset.id;

        fetch(`/walk/course/${courseId}/like`, { method: 'POST' })
            .then(response => {
                if (response.status === 401 ||
                    (response.redirected && new URL(response.url).pathname === '/member/sign-in')) {
                    const returnUrl = location.pathname + location.search + location.hash;
                    location.href = '/member/sign-in?redirectURL=' + encodeURIComponent(returnUrl);
                    return null;
                }
                if (response.status === 409) {
                    alert('이미 추천했습니다');
                    return null;
                }
                if (!response.ok) throw new Error('추천 요청 실패');
                return response.json();
            })
            .then(likeCount => {
                if (likeCount === null) return;
                const numSpan = btn.closest('.course-card').querySelector('.like-num');
                if (numSpan) numSpan.innerText = likeCount;
            })
            .catch(error => {
                console.error(error);
                alert('추천 처리에 실패했습니다.');
            });
    }
</script>

</body>
</html>
