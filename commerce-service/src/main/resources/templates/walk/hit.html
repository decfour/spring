<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Walk Hit</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body data-view="walk-hit">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            Walking <span class="subtitle">Hit</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/walk}" class="btn-secondary">뒤로</a>
        </div>
    </div>

    <div class="map-wrapper">
        <div class="map-status-badge" id="status">
            🔥 추천수가 높은 코스
        </div>

        <div id="map" class="map-card"></div>
    </div>

    <div class="course-section">
        <div th:if="${courses == null or courses.isEmpty()}" class="course-empty">
            추천 산책 코스가 없습니다.
        </div>

        <div th:if="${courses != null and !courses.isEmpty()}" id="courseList" class="course-list">

            <div th:each="course, iterStat : ${courses}"
                 class="course-card"
                 th:data-id="${course.id}"
                 th:data-route="${course.routeData}"
                 th:data-lat="${course.startLat}"
                 th:data-lng="${course.startLng}">

                <th:block th:with="rank=${courses.number * courses.size + iterStat.count}">
                    <div class="course-rank"
                         th:classappend="${rank == 1 ? 'gold' : (rank == 2 ? 'silver' : (rank == 3 ? 'bronze' : ''))}"
                         th:text="${rank}">
                        1
                    </div>
                </th:block>

                <div class="course-content">
                    <div class="course-name">
                        <a th:href="@{/walk/course/{id}(id=${course.id})}"
                           th:text="${course.title}"
                           class="course-detail-link"
                           onclick="event.stopPropagation();">
                            코스 이름
                        </a>
                    </div>

                    <div class="course-info">
                        <span th:text="${course.distance >= 1000 ? #numbers.formatDecimal(course.distance / 1000.0, 1, 1) + ' km' : course.distance + ' m'}">
                            0 m
                        </span>

                        <span>•</span>

                        <span th:text="${T(java.lang.Math).round(course.duration / 60.0) + '분'}">
                            0분
                        </span>

                        <button type="button"
                                class="btn-like-count"
                                th:data-id="${course.id}"
                                onclick="likeCourse(event, this)">
                            ❤️ <span class="like-num" th:text="${course.likeCount ?: 0}">0</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>
        <div th:if="${courses != null and courses.totalPages > 1}" class="pager"
             th:with="endPage=${T(java.lang.Math).min(T(java.lang.Math).max(0, courses.number - 2) + 4, courses.totalPages - 1)},
                      startPage=${T(java.lang.Math).max(0, endPage - 4)}">

            <button type="button" class="btn-page"
                    th:data-url="@{/walk/course/hit(page=${courses.number - 1})}"
                    onclick="location.href = this.dataset.url"
                    th:disabled="${courses.first}">
                ‹
            </button>

            <th:block th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}">
                <button type="button" class="btn-page"
                        th:data-url="@{/walk/course/hit(page=${pageNumber})}"
                        onclick="if (!this.classList.contains('active')) location.href = this.dataset.url"
                        th:text="${pageNumber + 1}"
                        th:classappend="${pageNumber == courses.number} ? 'active' : ''">
                    1
                </button>
            </th:block>

            <button type="button" class="btn-page"
                    th:data-url="@{/walk/course/hit(page=${courses.number + 1})}"
                    onclick="location.href = this.dataset.url"
                    th:disabled="${courses.last}">
                ›
            </button>
        </div>
    </div>

</div>

<script>
    const map = new kakao.maps.Map(
        document.getElementById('map'),
        {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 3
        }
    );

    let currentMarker = null;
    let currentRoute = null;

    document.querySelectorAll('.course-card').forEach(card => {
        card.addEventListener('click', function() {
            document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));
            this.classList.add('selected');
            showCourseOnMap(this);
        });
    });

    function showCourseOnMap(card) {
        try {
            const routeData = JSON.parse(card.dataset.route);
            const startLat = parseFloat(card.dataset.lat);
            const startLng = parseFloat(card.dataset.lng);
            const startPosition = new kakao.maps.LatLng(startLat, startLng);

            map.setCenter(startPosition);

            if (currentRoute) {
                currentRoute.setMap(null);
            }

            if (currentMarker) {
                currentMarker.setMap(null);
            }

            currentMarker = new kakao.maps.Marker({
                position: startPosition,
                map: map
            });

            const path = routeData.map(point => new kakao.maps.LatLng(point[1], point[0]));

            currentRoute = new kakao.maps.Polyline({
                path: path,
                strokeWeight: 5,
                strokeColor: '#1d1d1f',
                strokeOpacity: 0.85,
                strokeStyle: 'solid'
            });

            currentRoute.setMap(map);
        } catch (e) {
            console.error('코스 데이터 파싱 실패:', e);
        }
    }

    function likeCourse(event, btn) {
        event.stopPropagation();
        const courseId = btn.dataset.id;

        fetch(`/walk/course/${courseId}/like`, { method: 'POST' })
            .then(response => {
                if (!response.ok) throw new Error('추천 실패');
                return response.json();
            })
            .then(likeCount => {
                const numSpan = btn.querySelector('.like-num');
                if (numSpan) numSpan.innerText = likeCount;
            })
            .catch(error => {
                console.error(error);
                alert('추천 처리에 실패했습니다.');
            });
    }
</script>

</body>
</html>
