<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="styles">
        <th:block th:replace="~{common/header :: styles}"></th:block>
        <link rel="stylesheet" th:href="@{/css/walk.css}">
    </th:block>
</head>
<body>
<section th:fragment="map(message, showLocation)" class="map-frame" aria-label="산책 코스 지도">
    <div class="map-status" id="status" role="status" aria-live="polite">
        <span th:if="${message != null}" th:text="${message}">지도 안내</span>
        <th:block th:if="${message == null}">
            <span>거리 <strong id="distance">-</strong></span>
            <span aria-hidden="true">·</span>
            <span>예상 <strong id="duration">-</strong></span>
        </th:block>
    </div>
    <div id="map" class="map-canvas"></div>
    <button th:if="${showLocation}" type="button" id="locationBtn" class="btn-action btn-map btn-location">현재 위치</button>
    <button th:if="${message == null}" type="button" id="addPinBtn" class="btn-action btn-map pin-add" aria-label="발견 장소 추가">
        <span id="pinLabel">발견</span>
        <span id="pinTotal">: <span id="pinCount" aria-live="polite">—</span></span>
    </button>
    <p th:if="${message == null}" id="pinStatus" role="status" aria-live="polite"></p>
</section>
</body>
</html>
