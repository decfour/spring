<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Course Detail</title>

    <th:block th:replace="~{walk/components :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pin.css}">
    <link rel="stylesheet" th:href="@{/css/tag.css}">
    <th:block th:replace="~{common/fold :: styles}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body class="theme walk-page" data-view="walk-detail">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="page-head">
        <h2 class="page-title m-0">
            <span>Walking</span>
            <span class="course-label" th:text="${course.title}" th:title="${course.title}">코스 이름</span>
        </h2>

        <div class="d-flex gap-2 align-items-center">
            <div class="dropdown"
                 th:if="${loginMember != null and (
                     (course.creator != null and course.creator.id == loginMember.id) or
                     loginMember.memberType == T(com.kdj.commerce.domain.member.MemberType).ADMIN
                 )}">
                <button class="btn-menu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end menu">
                    <li>
                        <form th:action="@{/walk/course/{id}/delete(id=${course.id})}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>

            <a th:href="@{/walk/course/{id}/chat(id=${course.id})}" class="btn-action">채팅</a>
            <a th:href="@{/walk/course/{id}/review(id=${course.id})}" class="btn-action">리뷰</a><button type="button" id="backBtn" class="btn-action">뒤로</button>
        </div>
    </div>


    <div th:replace="~{walk/components :: map(null, false)}"></div>

    <section class="pin-toolbar" aria-label="코스 활동">
        <button type="button" id="likeBtn" class="btn-like" aria-label="코스 추천">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use th:href="@{/images/icons/heart.svg#heart}"/></svg>
            <span id="likeCount" th:text="${course.likeCount}" aria-live="polite">0</span>
        </button>
        <span class="author-meta" th:text="${course.creator != null ? course.creator.name : '익명'}">사용자</span>
    </section>

    <div class="tag-bar panel">
        <div class="tag-list">
            <span th:each="t : ${tags}"
                  class="tag-chip"
                  th:attr="data-tag=${t.code}"
                  th:text="${t.description}">
                자연
            </span>
        </div>

        <div class="tag-actions">
            <div class="dropdown">
                <button class="btn-circle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="태그 추가">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <ul class="dropdown-menu dropdown-menu-end menu">
                    <li th:each="tagEnum : ${T(com.kdj.commerce.domain.walk.WalkTag).values()}">
                        <button type="button" class="dropdown-item"
                                th:onclick="addTag([[${tagEnum.name()}]])"
                                th:text="${tagEnum.description}">
                            태그명
                        </button>
                    </li>
                </ul>
            </div>
            <button type="button" class="btn-circle" data-bs-toggle="modal" data-bs-target="#tagsModal" title="태그 전체보기" aria-label="태그 전체보기">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div class="review-section panel">
        <div class="review-card" data-fold>
            <div id="courseReview" class="fold-text" th:if="${course.content != null and !course.content.isBlank()}" th:text="${course.content}">
                리뷰
            </div>
            <span th:if="${course.content == null or course.content.isBlank()}" class="review-empty">
                등록된 코스 소개가 없습니다
            </span>
            <th:block th:replace="~{common/fold :: toggle('courseReview')}"></th:block>
        </div>
    </div>

</div>

<div class="modal fade" id="tagsModal" tabindex="-1" aria-labelledby="tagsTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title font-weight-bold" id="tagsTitle">전체 태그</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex gap-2 flex-wrap">
                    <span th:each="t : ${tags}"
                          class="tag-chip"
                          th:attr="data-tag=${t.code}"
                          th:text="${t.description}">
                        자연
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.getElementById('backBtn').addEventListener('click', function () {
        history.back();
    });

    const course = {
        id: /*[[${course.id}]]*/ 0,
        startLat: /*[[${course.startLat}]]*/ 37.5665,
        startLng: /*[[${course.startLng}]]*/ 126.9780,
        endLat: /*[[${course.endLat}]]*/ 37.5700,
        endLng: /*[[${course.endLng}]]*/ 126.9800,
        routeData: /*[[${course.routeData}]]*/ '[]',
        distance: /*[[${course.distance}]]*/ 0,
        duration: /*[[${course.duration}]]*/ 0,
        likeCount: /*[[${course.likeCount}]]*/ 0
    };

    const map = new kakao.maps.Map(
        document.getElementById('map'),
        {
            center: new kakao.maps.LatLng(course.startLat, course.startLng),
            level: 3
        }
    );

    document.getElementById('distance').innerText = formatDistance(course.distance);
    document.getElementById('duration').innerText = formatDuration(course.duration);

    showCourseOnMap();
    const pinMemberLoggedIn = /*[[${loginMember != null}]]*/ false;

    const likeBtn = document.getElementById('likeBtn');
    likeBtn.addEventListener('click', function() {
        likeCourse();
    });

    function showCourseOnMap() {
        let routeData;
        try {
            routeData = typeof course.routeData === 'string'
                ? JSON.parse(course.routeData)
                : course.routeData;
        } catch (error) {
            console.error(error);
            return;
        }

        if (!routeData || routeData.length === 0) return;

        const path = routeData.map(point => new kakao.maps.LatLng(point[1], point[0]));

        const polyline = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 5,
            strokeColor: '#1d1d1f',
            strokeOpacity: 0.8,
            strokeStyle: 'solid'
        });

        polyline.setMap(map);

        const bounds = new kakao.maps.LatLngBounds();
        path.forEach(position => bounds.extend(position));
        map.setBounds(bounds, 40, 40, 40, 40);
    }

    function likeCourse() {
        fetch(`/walk/course/${course.id}/like`, { method: 'POST' })
            .then(response => {
                if (response.status === 401 ||
                    (response.redirected && new URL(response.url).pathname === '/member/sign-in')) {
                    const returnUrl = location.pathname + location.search + location.hash;
                    location.href = '/member/sign-in?redirectURL=' + encodeURIComponent(returnUrl);
                    return null;
                }
                if (response.status === 409) {
                    alert('이미 추천했습니다');
                    return null;
                }
                if (!response.ok) throw new Error('추천 요청 실패');
                return response.json();
            })
            .then(likeCount => {
                if (likeCount === null) return;
                document.getElementById('likeCount').innerText = likeCount;
            })
            .catch(error => {
                console.error(error);
                alert('추천 처리에 실패했습니다.');
            });
    }

    function addTag(tagCode) {
        fetch(`/walk/course/${course.id}/tag`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ tag: tagCode })
        })
        .then(response => {
            if (response.status === 401 ||
                (response.redirected && new URL(response.url).pathname === '/member/sign-in')) {
                const returnUrl = location.pathname + location.search + location.hash;
                location.href = '/member/sign-in?redirectURL=' + encodeURIComponent(returnUrl);
                return;
            }
            if (!response.ok) {
                const contentType = response.headers.get('Content-Type') || '';
                if (contentType.includes('application/json')) {
                    return response.json().then(error => { throw new Error(error.message); });
                }
                return response.text().then(msg => { throw new Error(msg); });
            }
            location.reload();
        })
        .catch(error => {
            alert(error.message || '태그 추가 실패');
        });
    }

    function formatDistance(distance) {
        if (distance == null) return '';
        return distance >= 1000
            ? (distance / 1000).toFixed(1) + ' km'
            : distance + ' m';
    }

    function formatDuration(duration) {
        if (duration == null) return '';
        return Math.round(duration / 60) + '분';
    }

</script>

<script th:src="@{/js/walk-pins.js}"></script>

</body>
</html>
