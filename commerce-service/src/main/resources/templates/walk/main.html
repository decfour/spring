<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Walk</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body data-view="walk-main">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            Walking
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/walk/course/hit}" class="btn-secondary">HIT</a>
            <a th:href="@{/walk/course/add}" class="btn-primary">등록</a>
            <a th:href="@{/}" class="btn-secondary">뒤로</a>
        </div>
    </div>

    <div class="map-wrapper">
        <div class="map-status-badge" id="status">
            📍 지도를 클릭하거나 현재 위치를 확인하세요
        </div>

        <div id="map" class="map-card"></div>

        <button type="button" id="locationBtn" class="btn-location">
            📍 현재 위치
        </button>
    </div>

    <div class="course-section">
        <div id="courseEmpty" class="course-empty" style="display: none;"></div>
        <div id="courseLoading" class="loading" style="display: none;">주변 코스를 찾는 중...</div>
        <div id="courseList" class="course-list"></div>
        <div id="pagination" class="pager"></div>
    </div>

</div>

<script>
    // 지도 위치 (이전)
    const savedLat = sessionStorage.getItem('walkLat');
    const savedLng = sessionStorage.getItem('walkLng');

    // 지도 위치 (초기)
    const initialLat = savedLat ? parseFloat(savedLat) : 37.5665;
    const initialLng = savedLng ? parseFloat(savedLng) : 126.9780;

    // 지도 객체
    const map = new kakao.maps.Map(
        document.getElementById('map'),
        {
            center: new kakao.maps.LatLng(initialLat, initialLng),
            level: 3
        }
    );

    // 현재 선택 마커
    let currentMarker = null;

    // 현재 선택 경로
    let currentRoute = null;

    // 현재 선택 코스 카드
    let selectedCourseCard = null;

    // 현재 선택 코스 ID
    let selectedCourseId = null;

    // 현재 위치 버튼, 현재 상태
    const locationBtn = document.getElementById('locationBtn');
    const status = document.getElementById('status');

    // 코스 목록 (목록, 로딩, 빈 상태, 페이징)
    const courseList = document.getElementById('courseList');
    const courseLoading = document.getElementById('courseLoading');
    const courseEmpty = document.getElementById('courseEmpty');
    const pagination = document.getElementById('pagination');

    // 현재 위치
    let currentLat = savedLat ? parseFloat(savedLat) : null;
    let currentLng = savedLng ? parseFloat(savedLng) : null;

     // 현재 위치 설정 + 근처 코스 탐색
    function setLocationAndFindCourses(lat, lng, statusText) {
        currentLat = lat;
        currentLng = lng;

        sessionStorage.setItem('walkLat', lat);
        sessionStorage.setItem('walkLng', lng);

        const position = new kakao.maps.LatLng(lat, lng);

        // 기존 마커 제거
        if (currentMarker) {
            currentMarker.setMap(null);
        }

        // 기존 경로 제거
        if (currentRoute) {
            currentRoute.setMap(null);
            currentRoute = null;
        }

        // 선택 코스 카드, ID 초기화
        selectedCourseCard = null;
        selectedCourseId = null;

        currentMarker = new kakao.maps.Marker({
            position: position,
            map: map
        });

        status.textContent = statusText;

        findNearbyCourses(lat, lng, 0);
    }

    // 지도 위치 복원
    function restoreSavedLocation() {
        if (currentLat === null || currentLng === null) {
            return;
        }

        const position = new kakao.maps.LatLng(
            currentLat,
            currentLng
        );

        map.setCenter(position);

        currentMarker = new kakao.maps.Marker({
            position: position,
            map: map
        });

        status.textContent = '📍 선택한 위치 기준';

        findNearbyCourses(currentLat, currentLng, 0);
    }

    // 현재 위치 클릭 이벤트
    function handleCurrentLocation() {
        if (!navigator.geolocation) {
            alert('이 브라우저에서는 위치 정보를 사용할 수 없습니다.');
            return;
        }

        locationBtn.disabled = true;
        locationBtn.innerText = '위치 확인 중..';

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                map.setCenter(new kakao.maps.LatLng(lat, lng));

                setLocationAndFindCourses(
                    lat,
                    lng,
                    '📍 내 현재 위치 기준'
                );

                locationBtn.disabled = false;
                locationBtn.innerText = '📍 현재 위치';
            },
            function(error) {
                console.error(error);

                alert(
                    '현재 위치를 가져오지 못했습니다.\n위치 권한을 확인해주세요.'
                );

                locationBtn.disabled = false;
                locationBtn.innerText = '📍 현재 위치';
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // 지도 클릭 이벤트
    function handleMapClick(mouseEvent) {
        const position = mouseEvent.latLng;

        setLocationAndFindCourses(
            position.getLat(),
            position.getLng(),
            '📍 선택한 위치 기준'
        );
    }

    // 근처 코스 탐색
    function findNearbyCourses(lat, lng, page) {
        courseEmpty.style.display = 'none';
        courseLoading.style.display = 'block';

        courseList.innerHTML = '';
        pagination.innerHTML = '';

        fetch(
            `/walk/course/nearby?lat=${lat}&lng=${lng}&page=${page}&size=3`
        )
            .then(response => {
                if (!response.ok) {
                    throw new Error('산책 코스 조회 실패');
                }

                return response.json();
            })
            .then(data => {
                courseLoading.style.display = 'none';

                renderCourses(data.content);
                renderPagination(data);
            })
            .catch(error => {
                console.error(error);

                courseLoading.style.display = 'none';
                courseEmpty.style.display = 'block';
                courseEmpty.innerText =
                    '주변 산책 코스를 불러오지 못했습니다.';
            });
    }

    // 근처 코스 표시
    function renderCourses(courses) {
        courseList.innerHTML = '';

        if (!courses || courses.length === 0) {
            courseEmpty.style.display = 'block';
            courseEmpty.innerText = '주변에 산책 코스가 없습니다';

            selectedCourseCard = null;

            return;
        }

        courseEmpty.style.display = 'none';

        courses.forEach(course => {
            const card = createCourseCard(course);

            courseList.appendChild(card);

            if (course.id === selectedCourseId) {
                card.classList.add('selected');
                selectedCourseCard = card;
            }
        });
    }

    // 코스 카드 생성
    function createCourseCard(course) {
        const card = document.createElement('div');

        card.className = 'course-card';

        card.innerHTML = `
            <div class="course-name">
                <span class="course-detail-link">
                    ${escapeHtml(course.title)}
                </span>
            </div>

            <div class="course-info">
                <span>${formatDistance(course.distance)}</span>
                <span>•</span>
                <span>${formatDuration(course.duration)}</span>

                <button type="button" class="btn-like-count">
                    ❤️ ${course.likeCount ?? 0}
                </button>
            </div>
        `;

        // 코스 상세 페이지 이동 이벤트
        const courseName = card.querySelector('.course-detail-link');

        courseName.addEventListener('click', function(event) {
            event.stopPropagation();

            location.href = `/walk/course/${course.id}`;
        });

        // 코스 선택 이벤트
        card.addEventListener('click', function() {
            selectCourse(card, course);
        });

        // 추천 이벤트
        const likeButton = card.querySelector('.btn-like-count');

        likeButton.addEventListener('click', function(event) {
            event.stopPropagation();

            likeCourse(course.id, likeButton);
        });

        return card;
    }

    // 코스 선택
    function selectCourse(card, course) {
        if (selectedCourseCard) {
            selectedCourseCard.classList.remove('selected');
        }

        card.classList.add('selected');

        selectedCourseCard = card;
        selectedCourseId = course.id;

        showCourseOnMap(course);
    }

    // 선택 코스 표시
    function showCourseOnMap(course) {
        const routeData = JSON.parse(course.routeData);

        const startPosition = new kakao.maps.LatLng(
            course.startLat,
            course.startLng
        );

        map.setCenter(startPosition);

        // 기존 경로 제거
        if (currentRoute) {
            currentRoute.setMap(null);
        }

        const path = routeData.map(
            point => new kakao.maps.LatLng(point[1], point[0])
        );

        currentRoute = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 5,
            strokeColor: '#1d1d1f',
            strokeOpacity: 0.8,
            strokeStyle: 'solid'
        });

        currentRoute.setMap(map);
    }

    // 선택 코스 추천
    function likeCourse(courseId, likeButton) {
        fetch(`/walk/course/${courseId}/like`, {
            method: 'POST'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('추천 요청 실패');
                }

                return response.json();
            })
            .then(likeCount => {
                likeButton.innerText = `❤️ ${likeCount}`;
            })
            .catch(error => {
                console.error(error);

                alert('추천 처리에 실패했습니다.');
            });
    }

    // 페이징
    function renderPagination(pageData) {
        pagination.innerHTML = '';

        if (!pageData.content || pageData.totalPages <= 1) {
            return;
        }

        const currentPage = pageData.number;
        const totalPages = pageData.totalPages;
        const maxButtons = 5;

        let startPage = Math.max(
            0,
            currentPage - Math.floor(maxButtons / 2)
        );

        let endPage = startPage + maxButtons - 1;

        if (endPage >= totalPages) {
            endPage = totalPages - 1;

            startPage = Math.max(
                0,
                endPage - maxButtons + 1
            );
        }

        // 이전 버튼
        const prevBtn = createPageButton(
            '‹',
            pageData.first,
            function() {
                findNearbyCourses(
                    currentLat,
                    currentLng,
                    currentPage - 1
                );
            }
        );

        pagination.appendChild(prevBtn);

        // 페이지 번호
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = createPageButton(
                (i + 1).toString(),
                false,
                function() {
                    if (i !== currentPage) {
                        findNearbyCourses(
                            currentLat,
                            currentLng,
                            i
                        );
                    }
                }
            );

            if (i === currentPage) {
                pageBtn.classList.add('active');
            }

            pagination.appendChild(pageBtn);
        }

        // 다음 버튼
        const nextBtn = createPageButton(
            '›',
            pageData.last,
            function() {
                findNearbyCourses(
                    currentLat,
                    currentLng,
                    currentPage + 1
                );
            }
        );

        pagination.appendChild(nextBtn);
    }

    // 페이징 버튼 생성
    function createPageButton(text, disabled, onClick) {
        const button = document.createElement('button');

        button.className = 'btn-page';
        button.innerText = text;
        button.disabled = disabled;

        button.addEventListener('click', onClick);

        return button;
    }

    // 거리 변환
    function formatDistance(distance) {
        if (distance == null) {
            return '';
        }

        return distance >= 1000
            ? (distance / 1000).toFixed(1) + ' km'
            : distance + ' m';
    }

    // 시간 변환
    function formatDuration(duration) {
        if (duration == null) {
            return '';
        }

        return Math.round(duration / 60) + '분';
    }

    // HTML 이스케이프
    function escapeHtml(value) {
        if (value == null) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // 지도 클릭 이벤트
    kakao.maps.event.addListener(
        map,
        'click',
        handleMapClick
    );

    // 현재 위치 버튼 이벤트
    locationBtn.addEventListener(
        'click',
        handleCurrentLocation
    );

    // 저장된 기준점이 있으면 복원
    restoreSavedLocation();

</script>

</body>
</html>
