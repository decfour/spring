<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Walk</title>

    <th:block th:replace="~{walk/fragments :: styles}"></th:block>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body class="theme walk-page" data-view="walk-main">
    <div th:replace="~{common/header :: mainHeader}"></div>

    <div class="page">
        <div class="page-head">
            <h2 class="page-title m-0">
                Walking
            </h2>

            <div class="d-flex gap-2">
                <a th:href="@{/walk/course/hit}"    class="btn-action">인기</a>
                <a th:href="@{/walk/course/add}"    class="btn-action">등록</a>
                <a th:href="@{/}"                   class="btn-action">뒤로</a>
            </div>
        </div>

        <div th:replace="~{walk/fragments :: map(
            message='지도를 클릭하거나 현재 위치를 확인하세요', showLocation=true, showDetails=false
        )}"></div>

        <div class="course-section">
            <div id="courseEmpty"   class="course-empty" style="display: none;"></div>
            <div id="courseLoading" class="loading" style="display: none;">주변 탐색 중...</div>
            <div id="courseList"    class="entry-list"></div>
            <div id="pagination"    class="pager"></div>
        </div>
    </div>

    <script th:src="@{/js/walk-main.js}"></script>
</body>
</html>
