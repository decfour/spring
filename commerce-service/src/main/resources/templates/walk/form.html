<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Add Course</title>

    <th:block th:replace="~{walk/fragments :: styles}"></th:block>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=baba859c014dd12bcc8c5450d67968c7"></script>
</head>

<body class="theme walk-page" data-view="walk-form">
    <div th:replace="~{common/header :: mainHeader}"></div>

    <div class="page">
        <div class="page-head">
            <h2 class="page-title m-0">
                Walking <span class="subtitle">Add</span>
            </h2>

            <a th:href="@{/walk}" class="btn-action">
                뒤로
            </a>
        </div>

        <div th:replace="~{walk/fragments :: map(
            message='출발지를 선택하세요', showLocation=true, showDetails=false
        )}"></div>

        <form th:action="@{/walk/add}" method="post">
            <div class="field-group">
                <label class="field-label" for="title">이름</label>
                <input type="text" id="title" name="title" class="field"
                       placeholder="코스 이름" maxlength="30" required>
            </div>

            <div class="field-group">
                <label class="field-label" for="content">설명</label>
                <textarea id="content" name="content" class="field" rows="2"
                          placeholder="코스 설명" maxlength="500" required></textarea>
            </div>

            <input type="hidden" id="startLat"  name="startLat">
            <input type="hidden" id="startLng"  name="startLng">
            <input type="hidden" id="endLat"    name="endLat">
            <input type="hidden" id="endLng"    name="endLng">
            <input type="hidden" id="routeData" name="routeData">
            <input type="hidden" id="distance"  name="distance">
            <input type="hidden" id="duration"  name="duration">

            <div class="form-actions">
                <button type="button"
                        id="resetBtn"
                        class="btn-action">
                    초기화
                </button>

                <button type="submit"
                        id="submitBtn"
                        class="btn-action btn-primary"
                        disabled>
                    등록
                </button>
            </div>
        </form>
    </div>

    <script th:src="@{/js/walk-form.js}"></script>
</body>
</html>
