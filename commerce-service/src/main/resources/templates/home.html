<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Don't Panic!</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body data-view="home">
    <div th:replace="~{common/header :: mainHeader}"></div>

    <div class="page">
        <h1 class="home-title">
            <img class="home-logo"
                 th:src="@{/images/branding/title.png}"
                 alt="The Hitchhiker's Guide to Earth"
                 width="1774"
                 height="887">
        </h1>

        <div class="home-nav">
            <a th:href="@{/walk}"       class="home-link home-link-main">
                <span>Walk</span>
            </a>
            <a th:href="@{/community}"  class="home-link home-link-sub">
                <span>Talk</span>
            </a>
            <a th:href="@{/shop}"       class="home-link home-link-sub">
                <span>Shop</span>
            </a>
        </div>
    </div>
</body>
</html>
