<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DON'T PANIC!</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .main-container {
            max-width: 680px;
            margin: 120px auto;
            padding: 0 20px;
        }
        .main-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .main-sub {
            font-size: 1.3rem;
            color: #86868b;
            font-weight: 400;
            letter-spacing: -0.4px;
            margin-bottom: 48px;
        }

        .nav-vertical {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #1d1d1f;
            transition: all 0.2s ease;
            width: fit-content;
        }
        .link-item:hover {
            color: #0066cc;
            transform: translateX(6px);
        }

        .link-item-primary {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .link-item-secondary {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .link-arrow {
            font-size: 0.95rem;
            margin-left: 8px;
            opacity: 0.4;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .link-item-primary .link-arrow {
            font-size: 1.2rem;
            opacity: 0.6;
        }
        .link-item:hover .link-arrow {
            opacity: 1;
            transform: translateX(3px);
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <h1 class="main-title">DON'T PANIC!</h1>
    <p class="main-sub">Every path has a story</p>

    <div class="nav-vertical">
        <a th:href="@{/walk}" class="link-item link-item-primary">
            <span>Walk</span>
            <span class="link-arrow">→</span>
        </a>

        <a th:href="@{/community}" class="link-item link-item-secondary">
            <span>Talk</span>
            <span class="link-arrow">→</span>
        </a>

        <a th:href="@{/shop}" class="link-item link-item-secondary">
            <span>Shop</span>
            <span class="link-arrow">→</span>
        </a>

        <a th:href="@{/notice}" class="link-item link-item-secondary">
            <span>Notice</span>
            <span class="link-arrow">→</span>
        </a>
    </div>
</div>

</body>
</html>
