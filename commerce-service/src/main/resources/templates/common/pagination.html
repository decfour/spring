<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pager(page, url)" th:if="${page != null and page.totalPages > 1}"
     class="pager" aria-label="페이지 탐색"
     th:with="end=${T(java.lang.Math).min(T(java.lang.Math).max(0, page.number - 2) + 4, page.totalPages - 1)},start=${T(java.lang.Math).max(0, end - 4)}">
    <span th:if="${page.first}" class="btn-page disabled" aria-label="이전 페이지" aria-disabled="true">‹</span>
    <a th:unless="${page.first}" class="btn-page" aria-label="이전 페이지"
       th:href="@{${url}(page=${page.number - 1})}">‹</a>
    <a th:each="number : ${#numbers.sequence(start, end)}" class="btn-page"
       th:href="@{${url}(page=${number})}" th:text="${number + 1}"
       th:classappend="${number == page.number} ? 'active'"
       th:attr="aria-current=${number == page.number ? 'page' : null}">1</a>
    <span th:if="${page.last}" class="btn-page disabled" aria-label="다음 페이지" aria-disabled="true">›</span>
    <a th:unless="${page.last}" class="btn-page" aria-label="다음 페이지"
       th:href="@{${url}(page=${page.number + 1})}">›</a>
</nav>
</body>
</html>
