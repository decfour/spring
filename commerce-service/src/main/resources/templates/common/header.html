<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"> <head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
    <th:block th:fragment="styles">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" th:href="@{/css/common.css}">
        <link rel="stylesheet" th:href="@{/css/pages.css}">
    </th:block>
</head>
<body>

<div th:fragment="mainHeader" class="site-nav">

    <div>
        <a href="/" class="site-logo">The Hitchhiker's Guide to Earth</a>
    </div>

    <div class="site-menu">

        <span th:if="${#authentication == null or #authentication.principal == 'anonymousUser'}" class="site-links">
            <a href="/member/sign-in" class="site-link">Sign In</a>
            <a href="/member/sign-on" class="site-link">Sign On</a>
        </span>

        <span th:if="${#authentication != null and #authentication.principal != 'anonymousUser'}" class="site-links">
            <a th:href="@{/member/my-page}"
               th:text="${#authentication.name}"
               class="site-user">User Email</a>

            <a href="/cart" class="site-link">Cart</a>

            <form th:action="@{/member/sign-out}" method="post" class="nav-form">
                <button type="submit" class="btn-logout">Sign Out</button>
            </form>
        </span>

    </div>
</div>

</body>
</html>
