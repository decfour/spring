<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .btn-apple-dark,
        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: 1px solid #1d1d1f;
        }

        .btn-apple-dark:hover {
            background-color: #434344;
            border-color: #434344;
            color: #ffffff;
        }

        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #1d1d1f;

            border: 1px solid #d2d2d7;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;

            transition: all 0.2s ease;
        }

        .product-card:hover {
            border-color: #0066cc;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.12);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f5f5f7;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            color: #86868b;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .product-info {
            padding: 10px 12px 12px;
        }

        .product-name {
            font-size: 0.88rem;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            margin-bottom: 4px;
        }

        .product-price {
            font-size: 0.84rem;
            font-weight: 600;
        }

        .product-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 5px;

            font-size: 0.75rem;
            color: #86868b;
        }

        .soldout-badge {
            color: #de363a;
            font-weight: 500;
            font-size: 0.75rem;
            background-color: rgba(222, 54, 58, 0.08);
            padding: 3px 8px;
            border-radius: 100px;
            border: 1px solid rgba(222, 54, 58, 0.2);
        }

        .empty-products {
            padding: 40px 20px;
            text-align: center;
            color: #86868b;
            font-size: 0.95rem;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
            margin-top: 30px;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .pagination {
            gap: 6px;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1d1d1f;
            background-color: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .page-btn:hover:not(.active):not(.disabled) {
            background-color: #f5f5f7;
            border-color: #d2d2d7;
        }

        .page-btn.active {
            background-color: #1d1d1f;
            color: #ffffff;
            font-weight: 600;
        }

        .page-btn.disabled {
            color: #d2d2d7;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <!-- 제목 -->
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">Shop</h2>

        <div class="d-flex gap-2">
            <a th:href="@{/shop/add}" class="btn-apple-dark">등록</a>
            <a th:href="@{/}" class="btn-apple-outline">뒤로</a>
        </div>
    </div>

    <!-- 상품 없음 -->
    <div th:if="${items.isEmpty()}"
         class="empty-products">
        등록된 상품이 없습니다
    </div>

    <!-- 상품 목록 -->
    <div th:if="${not items.isEmpty()}"
         class="product-grid">

        <a th:each="item : ${items}"
           th:href="@{/shop/item/{itemId}(itemId=${item.id})}"
           class="product-card">

            <!-- 이미지 -->
            <div class="product-image">

                <img th:if="${item.storeFileName != null}"
                     th:src="@{/images/{fileName}(fileName=${item.storeFileName})}"
                     th:alt="${item.name}">

                <span th:unless="${item.storeFileName != null}"
                      class="no-image">
                    이미지 없음
                </span>

            </div>

            <!-- 상품 정보 -->
            <div class="product-info">

                <div class="product-name"
                     th:text="${item.name}">
                    상품명
                </div>

                <div class="product-price"
                     th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">
                    10,000원
                </div>

                <div class="product-meta">

                    <span th:if="${item.stock > 0}"
                          th:text="'재고 ' + ${item.stock} + '개'">
                        재고 5개
                    </span>

                    <span th:unless="${item.stock > 0}"
                          class="soldout-badge">
                        품절
                    </span>

                    <span th:if="${item.open}">
                        판매 중
                    </span>

                    <span th:unless="${item.open}">
                        판매 중지
                    </span>

                </div>

            </div>

        </a>

    </div>

    <!-- 페이지네이션 -->
    <div th:if="${items.totalPages > 1}"
         class="pagination-container">

        <ul class="pagination mb-0">

            <!-- 이전 -->
            <li>
                <a th:href="@{/shop(page=${items.number - 1})}"
                   class="page-btn"
                   th:classappend="${items.first} ? 'disabled'">
                    ‹
                </a>
            </li>

            <!-- 페이지 번호 -->
            <th:block th:each="pageNumber : ${#numbers.sequence(0, items.totalPages - 1)}">

                <li>
                    <a th:href="@{/shop(page=${pageNumber})}"
                       th:text="${pageNumber + 1}"
                       class="page-btn"
                       th:classappend="${pageNumber == items.number} ? 'active'">
                        1
                    </a>
                </li>

            </th:block>

            <!-- 다음 -->
            <li>
                <a th:href="@{/shop(page=${items.number + 1})}"
                   class="page-btn"
                   th:classappend="${items.last} ? 'disabled'">
                    ›
                </a>
            </li>

        </ul>

    </div>

</div>

</body>
</html>
