<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Shop</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>

<body data-view="shop-list">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <!-- 제목 -->
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">Shop</h2>

        <div class="d-flex gap-2">
            <a th:href="@{/shop/add}" class="btn-primary">등록</a>
            <a th:href="@{/}" class="btn-secondary">뒤로</a>
        </div>
    </div>

    <!-- 상품 없음 -->
    <div th:if="${items.isEmpty()}"
         class="empty">
        등록된 상품이 없습니다
    </div>

    <!-- 상품 목록 -->
    <div th:if="${not items.isEmpty()}"
         class="product-grid">

        <a th:each="item : ${items}"
           th:href="@{/shop/item/{itemId}(itemId=${item.id})}"
           class="product-card">

            <!-- 이미지 -->
            <div class="product-image">

                <img th:if="${item.storedFileName != null}"
                     th:src="@{/images/{fileName}(fileName=${item.storedFileName})}"
                     th:alt="${item.name}">

                <span th:unless="${item.storedFileName != null}"
                      class="no-image">
                    이미지 없음
                </span>

            </div>

            <!-- 상품 정보 -->
            <div class="product-info">

                <div class="product-name"
                     th:text="${item.name}">
                    상품명
                </div>

                <div class="product-price"
                     th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">
                    10,000원
                </div>

                <div class="product-meta">

                    <span th:if="${item.stock > 0}"
                          th:text="'재고 ' + ${item.stock} + '개'">
                        재고 5개
                    </span>

                    <span th:unless="${item.stock > 0}"
                          class="soldout-badge">
                        품절
                    </span>

                    <span th:if="${item.open}">
                        판매 중
                    </span>

                    <span th:unless="${item.open}">
                        판매 중지
                    </span>

                </div>

            </div>

        </a>

    </div>

    <!-- 페이지네이션 -->
    <div th:if="${items.totalPages > 1}"
         class="pager">

        <ul class="pagination mb-0">

            <!-- 이전 -->
            <li>
                <a th:href="@{/shop(page=${items.number - 1})}"
                   class="btn-page"
                   th:classappend="${items.first} ? 'disabled'">
                    ‹
                </a>
            </li>

            <!-- 페이지 번호 -->
            <th:block th:each="pageNumber : ${#numbers.sequence(0, items.totalPages - 1)}">

                <li>
                    <a th:href="@{/shop(page=${pageNumber})}"
                       th:text="${pageNumber + 1}"
                       class="btn-page"
                       th:classappend="${pageNumber == items.number} ? 'active'">
                        1
                    </a>
                </li>

            </th:block>

            <!-- 다음 -->
            <li>
                <a th:href="@{/shop(page=${items.number + 1})}"
                   class="btn-page"
                   th:classappend="${items.last} ? 'disabled'">
                    ›
                </a>
            </li>

        </ul>

    </div>

</div>

</body>
</html>
