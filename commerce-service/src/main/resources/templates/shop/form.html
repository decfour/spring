<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${isEdit ?: false} ? 'THGTE - Edit Product' : 'THGTE - Add Product'">
        THGTE - Add Product
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .form-label-custom {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-apple {
            width: 100%;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #1d1d1f;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-apple:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        .form-control-apple::placeholder {
            color: #86868b;
        }

        .form-control-apple.field-error {
            border-color: #ff3b30;
        }

        .form-control-apple.field-error:focus {
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.15);
        }

        .form-select-apple {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%3c%2386868b' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 12px 12px;
            padding-right: 40px;
        }

        .field-error-text {
            color: #ff3b30;
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: 500;
        }

        .btn-apple-dark,
        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
        }

        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: 1px solid #1d1d1f;
        }

        .btn-apple-dark:hover {
            background-color: #434344;
            border-color: #434344;
            color: #ffffff;
        }

        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .form-check-input {
            width: 1.1em;
            height: 1.1em;
            margin-top: 0.15em;
            border-color: #d2d2d7;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #0066cc;
            border-color: #0066cc;
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
            border-color: #0066cc;
        }

        .form-check-label {
            font-size: 0.95rem;
            color: #1d1d1f;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            Shop <span class="text-muted" style="font-weight:400;" th:text="${isEdit ?: false} ? 'Edit' : 'Add'">Add</span>
        </h2>
    </div>

    <form id="itemForm"
          th:action
          th:object="${item}"
          method="post"
          enctype="multipart/form-data">

        <div class="mb-4">
            <label for="name" class="form-label-custom">상품명</label>
            <input type="text"
                   id="name"
                   th:field="*{name}"
                   class="form-control-apple"
                   placeholder="상품명을 입력하세요"
                   maxlength="30"
                   th:classappend="${#fields.hasErrors('name')} ? 'field-error' : ''">

            <div class="field-error-text" th:errors="*{name}"></div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="price" class="form-label-custom">가격</label>
                <input type="number"
                       id="price"
                       th:field="*{price}"
                       class="form-control-apple"
                       placeholder="가격을 입력하세요"
                       th:classappend="${#fields.hasErrors('price')} ? 'field-error' : ''">

                <div class="field-error-text" th:errors="*{price}"></div>
            </div>

            <div class="col-md-6 mt-4 mt-md-0">
                <label for="stock" class="form-label-custom">수량</label>
                <input type="number"
                       id="stock"
                       th:field="*{stock}"
                       class="form-control-apple"
                       placeholder="수량을 입력하세요"
                       th:classappend="${#fields.hasErrors('stock')} ? 'field-error' : ''">

                <div class="field-error-text" th:errors="*{stock}"></div>
            </div>
        </div>

        <div class="mb-4">
            <label for="description" class="form-label-custom">설명</label>
            <textarea id="description"
                      rows="4"
                      th:field="*{description}"
                      class="form-control-apple"
                      placeholder="상품 설명을 입력하세요..."
                      style="resize: none;"
                      th:classappend="${#fields.hasErrors('description')} ? 'field-error' : ''"></textarea>

            <div class="field-error-text" th:errors="*{description}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label-custom">카테고리</label>
            <div class="d-flex gap-4 pt-1">
                <div th:each="type : ${itemTypes}" class="form-check">
                    <input type="radio"
                           th:field="*{itemType}"
                           th:value="${type.name()}"
                           class="form-check-input">
                    <label th:for="${#ids.prev('itemType')}"
                           th:text="${type.description}"
                           class="form-check-label">
                    </label>
                </div>
            </div>
            <div class="field-error-text" th:errors="*{itemType}"></div>
        </div>

        <div class="mb-4">
            <label for="deliveryType" class="form-label-custom">배송 방식</label>
            <select id="deliveryType"
                    th:field="*{deliveryType}"
                    class="form-control-apple form-select-apple"
                    th:classappend="${#fields.hasErrors('deliveryType')} ? 'field-error' : ''">
                <option value="">배송 방식을 선택하세요</option>
                <option th:each="type : ${deliveryTypes}"
                        th:value="${type.name()}"
                        th:text="${type.description}">
                </option>
            </select>
            <div class="field-error-text" th:errors="*{deliveryType}"></div>
        </div>

        <div class="mb-4">
            <label for="imageFile"
                   class="form-label-custom"
                   th:text="${isEdit ?: false} ? '상품 이미지 변경' : '상품 대표 이미지'">
                상품 대표 이미지
            </label>
            <input type="file"
                   id="imageFile"
                   th:field="*{imageFile}"
                   class="form-control-apple">
        </div>

        <div class="form-check mb-4">
            <input type="checkbox"
                   id="open"
                   th:field="*{open}"
                   class="form-check-input">
            <label for="open" class="form-check-label">
                판매 중
            </label>
        </div>

        <div class="d-flex gap-2 justify-content-end align-items-center mt-4">
            <a th:if="${isEdit ?: false}"
               th:href="@{/shop/item/{id}(id=${item.id})}"
               class="btn-apple-outline">
                취소
            </a>

            <a th:unless="${isEdit ?: false}"
               th:href="@{/shop}"
               class="btn-apple-outline">
                취소
            </a>

            <button type="submit"
                    class="btn-apple-dark"
                    th:text="${isEdit ?: false} ? '수정' : '등록'">
                등록
            </button>
        </div>

    </form>

</div>

</body>
</html>
