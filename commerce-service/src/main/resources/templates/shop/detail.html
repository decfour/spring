<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="'THGTE - ' + ${item.name}">THGTE - Item</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body data-view="shop-detail">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            <span>Shop</span>
            <span class="detail-title" th:text="${item.name}">상품명</span>
        </h2>

        <div class="d-flex gap-2 align-items-center">
            <div class="dropdown"
                 th:if="${member != null and (
                     item.creatorId == member.id or
                     (member.memberType != null and member.memberType.name() == 'ADMIN')
                 )}">
                <button class="btn-menu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end menu">
                    <li>
                        <a class="dropdown-item" th:href="@{/shop/item/{itemId}/edit(itemId=${item.id})}">수정</a>
                    </li>
                    <li th:if="${!item.deleted}">
                        <form th:action="@{/shop/item/{id}/delete(id=${item.id})}"
                              method="post"
                              onsubmit="return confirm('삭제하시겠습니까?');">
                            <button type="submit" class="dropdown-item text-danger">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>

            <a th:href="@{/shop/item/{itemId}/review(itemId=${item.id})}" class="btn-action">리뷰</a>
            <a th:href="@{/shop}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div class="surface-card product-overview-card">
        <div class="img-square-wrapper">
            <img th:if="${item.storedFileName != null}" th:src="@{/images/{filename}(filename=${item.storedFileName})}" alt="상품 이미지" />
            <span th:unless="${item.storedFileName != null}" class="text-muted" style="font-size: 0.85rem;">이미지 없음</span>
        </div>

        <div class="d-flex flex-column justify-content-center">
            <div class="detail-row">
                <div class="detail-label">종류</div>
                <div class="detail-value fw-medium" th:text="${item.itemType.description}">종류</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">상태</div>
                <div class="detail-value">
                    <span class="status-badge" th:text="${item.open} ? '판매 중' : '판매 중지'" th:style="${item.open} ? 'color:#0066cc;' : 'color:#86868b;'">상태</span>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-label">가격</div>
                <div class="detail-value fw-bold fs-5" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">0원</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">재고</div>
                <div class="detail-value fw-medium" th:text="${item.stock} + '개'">0개</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">배송</div>
                <div class="detail-value fw-medium" th:text="${item.deliveryType.description}">일반배송</div>
            </div>
        </div>
    </div>

    <div th:if="${item.description != null and !#strings.isEmpty(#strings.trim(item.description))}"
         class="surface-card item-card"
         th:text="${item.description}">
        상품 설명
    </div>

    <div th:if="${item.open}" class="surface-card purchase-card">
        <div th:if="${item.stock > 0}" class="d-flex flex-column gap-3">
            <form th:action="@{/order/one}" method="get" class="purchase-row">
                <input type="hidden" name="itemId" th:value="${item.id}" />
                <span class="form-label-fixed">즉시 결제</span>
                <div class="d-flex align-items-center gap-2">
                    <input type="number"
                           name="itemCount"
                           min="1"
                           th:max="${item.stock}"
                           value="1"
                           class="field input-quantity"
                           required />
                    <button type="submit" class="btn-action">결제</button>
                </div>
            </form>

            <form th:action="@{/cart/item/add}" method="post" class="purchase-row">
                <input type="hidden" name="itemId" th:value="${item.id}" />
                <span class="form-label-fixed">장바구니</span>
                <div class="d-flex align-items-center gap-2">
                    <input type="number" name="itemCount" min="1" th:max="${item.stock}" value="1" class="field input-quantity" required />
                    <button type="submit" class="btn-action">담기</button>
                </div>
            </form>
        </div>

        <div th:unless="${item.stock > 0}" class="text-center py-2 fw-semibold" style="color: #ff3b30; font-size: 0.92rem;">
            현재 품절된 상품입니다.
        </div>
    </div>

</div>

</body>
</html>
