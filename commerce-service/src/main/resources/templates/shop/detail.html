<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .detail-container {
            max-width: 680px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .item-header {
            margin-bottom: 32px;
        }
        .item-meta {
            font-size: 0.85rem;
            color: #86868b;
            margin-bottom: 8px;
        }
        .item-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.3;
        }

        .product-overview {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
            padding-bottom: 32px;
            border-bottom: 1px solid #e5e5e7;
        }
        @media (max-width: 576px) {
            .product-overview {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        .img-square-wrapper {
            aspect-ratio: 1 / 1;
            width: 100%;
            background-color: #f5f5f7;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-square-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f7;
            font-size: 0.95rem;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            width: 90px;
            color: #86868b;
            font-size: 0.9rem;
        }
        .detail-value {
            flex: 1;
            color: #1d1d1f;
        }

        .description-box {
            padding: 32px 0;
            border-bottom: 1px solid #1d1d1f;
            font-size: 1rem;
            line-height: 1.6;
            color: #333336;
            white-space: pre-wrap;
        }

        .order-box {
            background-color: #f5f5f7;
            border-radius: 16px;
            padding: 24px;
            margin: 32px 0;
        }
        .order-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .form-label-fixed {
            font-size: 0.9rem;
            font-weight: 600;
            width: 80px;
            color: #1d1d1f;
        }
        .input-quantity {
            width: 72px;
            height: 38px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            padding: 0 8px;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            background-color: #ffffff;
        }
        .input-quantity:focus {
            border-color: #0066cc;
        }

        .btn-minimal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-minimal-light {
            background-color: #f5f5f7;
            color: #1d1d1f;
            border: none;
        }
        .btn-minimal-light:hover {
            background-color: #e8e8ed;
            color: #1d1d1f;
        }
        .btn-minimal-outline {
            background-color: #ffffff;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }
        .btn-minimal-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
        }
        .btn-minimal-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: none;
        }
        .btn-minimal-dark:hover {
            background-color: #333336;
            color: #ffffff;
        }

        .action-bar {
            display: flex;
            align-items: center;
            margin-top: 32px;
        }
        .action-left { flex: 1; display: flex; justify-content: flex-start; gap: 8px; }
        .action-center { display: flex; justify-content: center; }
        .action-right { flex: 1; display: flex; justify-content: flex-end; }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="detail-container">

    <!-- Header Area -->
    <div class="item-header">
        <div class="item-meta">
            <span th:text="${item.itemType.description}">종류</span> •
            <span th:text="${item.open} ? '판매 중' : '판매 중지'" th:style="${item.open} ? 'color:#0066cc;' : 'color:#86868b;'">상태</span>
        </div>
        <h1 class="item-title" th:text="${item.name}">상품명</h1>
    </div>

    <!-- Product Overview (Image + Specs) -->
    <div class="product-overview">
        <!-- Image Box -->
        <div class="img-square-wrapper">
            <img th:if="${item.storeFileName != null}" th:src="@{/images/{filename}(filename=${item.storeFileName})}" alt="상품 이미지" />
            <span th:unless="${item.storeFileName != null}" class="text-muted" style="font-size: 0.85rem;">이미지 없음</span>
        </div>

        <!-- Spec Table -->
        <div class="d-flex flex-column justify-content-center">
            <div class="detail-row">
                <div class="detail-label">가격</div>
                <div class="detail-value fw-bold fs-5" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">0원</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">재고</div>
                <div class="detail-value" th:text="${item.stock} + '개'">0개</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">배송</div>
                <div class="detail-value" th:text="${item.deliveryType.description}">일반배송</div>
            </div>
        </div>
    </div>

    <!-- Description -->
    <div class="description-box" th:text="${item.description}">
        상품 설명
    </div>

    <!-- Order & Cart Options -->
    <div th:if="${item.open}" class="order-box">
        <div th:if="${item.stock > 0}" class="d-flex flex-column gap-3">
            <!-- 바로 결제 Form -->
            <form th:action="@{/order/one}" method="post" class="order-row">
                <input type="hidden" name="itemId" th:value="${item.id}" />
                <span class="form-label-fixed">즉시 결제</span>
                <input type="number" name="count" min="1" th:max="${item.stock}" value="1" class="input-quantity" required />
                <button type="submit" class="btn-minimal btn-minimal-dark">결제하기</button>
            </form>

            <!-- 장바구니 담기 Form -->
            <form th:action="@{/cart/add}" method="post" class="order-row">
                <input type="hidden" name="itemId" th:value="${item.id}" />
                <span class="form-label-fixed">장바구니</span>
                <input type="number" name="count" min="1" th:max="${item.stock}" value="1" class="input-quantity" required />
                <button type="submit" class="btn-minimal btn-minimal-outline">담기</button>
            </form>
        </div>

        <!-- 품절 표시 -->
        <div th:unless="${item.stock > 0}" class="text-center py-2" style="color: #ff3b30; font-weight: 600; font-size: 0.95rem;">
            현재 품절된 상품입니다.
        </div>
    </div>

    <!-- Bottom Actions -->
    <div class="action-bar">
        <div class="action-left">
            <a th:href="@{/shop}" class="btn-minimal btn-minimal-light">목록</a>
            <a th:href="@{/shop/item/{itemId}/review(itemId=${item.id})}" class="btn-minimal btn-minimal-light">리뷰</a>
        </div>

        <div class="action-center"></div>

        <div class="action-right">
            <a th:if="${member != null and (item.createdBy == member.id or member.memberType.name() == 'ADMIN')}"
               th:href="@{/shop/item/{itemId}/edit(itemId=${item.id})}"
               class="btn-minimal btn-minimal-outline">수정</a>
        </div>
    </div>

</div>

</body>
</html>
