<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Community Hit</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>
<body data-view="community-hit">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">Hit</h2>

        <div class="d-flex gap-2">
            <a th:href="@{/community}" class="btn-primary">일반</a>
            <a th:href="@{/community/add}" class="btn-primary">등록</a>
            <a th:href="@{/}" class="btn-secondary">뒤로</a>
        </div>
    </div>

    <table th:if="${posts != null and !posts.isEmpty()}" class="data-table">
        <thead>
        <tr>
            <th style="width: 50%; text-align: left;">제목</th>
            <th style="width: 15%; text-align: center;">작성자</th>
            <th style="width: 15%; text-align: center;">추천</th>
            <th style="width: 20%; text-align: center;">작성일</th>
        </tr>
        </thead>

        <tbody>
        <tr class="entry-row" th:each="post : ${posts}">
            <td>
                <a th:href="@{/community/post/{id}(id=${post.id})}"
                   th:text="${post.title}"
                   class="entry-link">제목</a>
            </td>

            <td th:text="${post.creator != null ? post.creator.name : '익명'}" class="post-writer">작성자</td>

            <td th:text="${post.likeCount}" class="post-likes">0</td>

            <td th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}" class="post-date">2026.07.24</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${posts == null or posts.isEmpty()}" class="empty">
        게시글 없음
    </div>

    <div th:if="${posts != null and posts.totalPages > 1}" class="pager">
        <a th:href="@{/community/hits(page=${posts.number - 1})}"
           class="btn-page"
           th:classappend="${posts.first} ? 'disabled' : ''">‹</a>

        <th:block th:if="${posts.totalPages > 0}"
                  th:each="pageNumber : ${#numbers.sequence(0, posts.totalPages - 1)}">
            <a th:href="@{/community/hits(page=${pageNumber})}"
               th:text="${pageNumber + 1}"
               class="btn-page"
               th:classappend="${pageNumber == posts.number} ? 'active' : ''">1</a>
        </th:block>

        <a th:href="@{/community/hits(page=${posts.number + 1})}"
           class="btn-page"
           th:classappend="${posts.last} ? 'disabled' : ''">›</a>
    </div>
</div>

</body>
</html>
