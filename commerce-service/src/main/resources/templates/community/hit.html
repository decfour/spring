<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Community Hit</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body class="theme" data-view="community-hit">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">
    <div class="page-head">
        <h2 class="page-title m-0">Talk <span class="subtitle">HIT</span></h2>

        <div class="d-flex gap-2">
            <a th:href="@{/community}" class="btn-action">일반</a>
            <a th:href="@{/community/add}" class="btn-action">등록</a>
            <a th:href="@{/}" class="btn-action">뒤로</a>
        </div>
    </div>

    <th:block th:replace="~{community/board :: lists('/community/hits')}"></th:block>

</div>

</body>
</html>
