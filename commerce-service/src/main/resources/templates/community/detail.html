<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'THGTE - ' + ${post.title}">THGTE - Post Detail</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body data-view="community-detail">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="page-head">
        <h2 class="page-title m-0">
            <span>Talk</span>
            <span class="detail-title" th:text="${post.title}">제목</span>
        </h2>

        <div class="d-flex gap-2 align-items-center">
            <div class="dropdown"
                 th:if="${loginMember != null and (
                     (post.creator != null and post.creator.id == loginMember.id) or
                     (loginMember.memberType != null and loginMember.memberType.name() == 'ADMIN')
                 )}">
                <button class="btn-menu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end menu">
                    <li>
                        <a class="dropdown-item" th:href="@{/community/post/{id}/edit(id=${post.id})}">수정</a>
                    </li>
                    <li>
                        <form th:action="@{/community/post/{id}/delete(id=${post.id})}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>

            <a th:href="@{/community}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div class="detail-meta">
        <div class="post-info-row">
            <div class="info-col col-writer">
                <span class="author-meta">
                    작성자 <span class="text-dark font-weight-bold" th:text="${post.creator != null ? post.creator.name : '익명'}">사용자</span>
                    <span class="meta-divider">•</span>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.17 21:28</span>
                    <span class="meta-divider">•</span>
                    조회 <span class="text-dark font-weight-bold" th:text="${post.viewCount}">0</span>
                </span>
            </div>

            <div class="info-col col-like">
                <form th:action="@{/community/post/{id}/like(id=${post.id})}" method="post" class="m-0">
                    <button type="submit" class="btn-like">
                        ❤️ <span th:text="${post.likeCount}">0</span>
                    </button>
                </form>
            </div>

            <div class="info-col col-empty"></div>
        </div>
    </div>

    <div class="surface-card post-card" th:text="${post.content}">
        내용
    </div>

    <div class="comments-section">
        <div class="comments-header">
            댓글 <span class="count" th:text="${comments.totalElements}">0</span>
        </div>

        <div th:each="comment : ${comments.content}" class="surface-card comment-item">
            <div class="comment-head">
                <strong class="comment-writer" th:text="${comment.creator != null ? comment.creator.name : '익명'}">작성자</strong>
                <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.17 21:28</span>

                <div class="comment-actions">
                    <div class="dropdown"
                         th:if="${loginMember != null and (
                             (comment.creator != null and comment.creator.id == loginMember.id) or
                             (loginMember.memberType != null and loginMember.memberType.name() == 'ADMIN')
                         )}">
                        <button class="btn-menu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            •••
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end menu">
                            <li>
                                <form th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger" onclick="return confirm('댓글을 삭제하시겠습니까?');">삭제</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="comment-content" th:text="${comment.content}">
                댓글
            </div>
        </div>

        <div class="surface-card comment-form" th:if="${loginMember != null}">
            <form method="post" th:action="@{/comment/{id}/add(id=${post.id})}">
                <input type="hidden" name="postId" th:value="${post.id}"/>
                <textarea name="content" rows="3" class="field" placeholder="댓글을 남겨주세요"></textarea>
                <div class="d-flex justify-content-end mt-3">
                    <button class="btn-action" type="submit">등록</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{common/pagination :: pager(${comments}, @{/community/post/{id}(id=${post.id})})}"></div>

</div>

</body>
</html>
