<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Base Styles */
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .detail-container {
            max-width: 680px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* Detail Header */
        .detail-header {
            margin-bottom: 24px;
        }
        .item-meta {
            font-size: 0.85rem;
            color: #86868b;
            margin-bottom: 12px;
        }
        .item-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        .item-author-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            padding-bottom: 24px;
            min-height: 38px;
        }
        .item-author-bar .author-name {
            color: #1d1d1f;
            font-weight: 600;
        }

        /* Content Body */
        .item-body {
            border-top: 1px solid #1d1d1f;
            border-bottom: 1px solid #e5e5e7;
            padding: 40px 10px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #333336;
            white-space: pre-wrap;
            min-height: 200px;
        }

        /* Action Buttons Area */
        .action-bar {
            display: flex;
            align-items: center;
            margin: 32px 0;
        }
        .action-left { flex: 1; display: flex; justify-content: flex-start; }
        .action-center { display: flex; justify-content: center; }
        .action-right { flex: 1; }

        /* Unified Minimal Buttons */
        .btn-minimal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }
        /* 목록 버튼 (Light Gray Standard) */
        .btn-minimal-light {
            background-color: #f5f5f7;
            color: #1d1d1f;
            border: none;
        }
        .btn-minimal-light:hover {
            background-color: #e8e8ed;
            color: #1d1d1f;
        }
        /* 추천 버튼 (Outlined Accent) */
        .btn-minimal-like {
            background-color: #ffffff;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }
        .btn-minimal-like:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
        }
        .btn-minimal-like .like-icon {
            color: #ff3b30;
        }
        /* 주요 액션 버튼 (Dark Solid) */
        .btn-minimal-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: none;
        }
        .btn-minimal-dark:hover {
            background-color: #333336;
            color: #ffffff;
        }

        /* Dropdown Icon Menu */
        .dropdown-toggle-icon {
            background: none;
            border: none;
            color: #86868b;
            font-size: 1.1rem;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .dropdown-toggle-icon:hover {
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .dropdown-menu-apple {
            border-radius: 12px;
            border: 1px solid #e5e5e7;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 6px;
            min-width: 100px;
        }
        .dropdown-menu-apple .dropdown-item {
            font-size: 0.85rem;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 500;
        }
        .dropdown-menu-apple .dropdown-item.text-danger:hover {
            background-color: #fff2f2;
        }

        /* Comments Section */
        .comments-section {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #1d1d1f;
        }
        .comments-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .comments-header .count {
            color: #0066cc;
            margin-left: 2px;
        }
        .comment-item {
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e7;
        }
        .comment-header-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-bottom: 8px;
        }
        .comment-writer {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1d1d1f;
            white-space: nowrap;
        }
        .comment-date {
            font-size: 0.8rem;
            color: #86868b;
            text-align: center;
            white-space: nowrap;
        }
        .comment-more-wrap {
            display: flex;
            justify-content: flex-end;
            min-height: 24px;
        }
        .comment-content {
            font-size: 0.95rem;
            color: #333336;
            white-space: pre-wrap;
            line-height: 1.55;
            word-break: break-word;
        }

        /* Comment Form */
        .comment-write {
            margin-top: 28px;
            background-color: #f5f5f7;
            padding: 16px;
            border-radius: 14px;
        }
        .comment-textarea {
            background-color: #ffffff;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
        }
        .comment-textarea:focus {
            border-color: #0066cc;
            box-shadow: none;
            outline: none;
        }

        /* Pagination */
        .apple-pagination .page-link {
            border: none;
            color: #1d1d1f;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 980px;
            background: transparent;
        }
        .apple-pagination .page-item.active .page-link {
            background-color: #1d1d1f;
            color: #ffffff;
        }
        .apple-pagination .page-item.disabled .page-link {
            color: #d2d2d7;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="detail-container">

    <!-- Header Area -->
    <div class="detail-header">
        <div class="item-meta">
            <span>커뮤니티</span> •
            <span th:text="${#temporals.format(post.createdDate, 'yyyy년 MM월 dd일 HH:mm')}">2026년 07월 24일 15:30</span> •
            <span>조회 <th:block th:text="${post.viewCount}">0</th:block></span>
        </div>

        <h1 class="item-title" th:text="${post.title}">제목</h1>

        <div class="item-author-bar">
            <span class="author-name" th:text="${post.writer != null ? post.writer.username : '익명'}">작성자</span>

            <div class="dropdown" th:if="${loginMember != null and ((post.writer != null and loginMember.id == post.writer.id) or (loginMember.memberType != null and loginMember.memberType.name() == 'ADMIN'))}">
                <button class="dropdown-toggle-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-apple">
                    <li>
                        <a class="dropdown-item" th:href="@{/community/post/{id}/edit(id=${post.id})}">수정</a>
                    </li>
                    <li>
                        <form th:action="@{/community/post/{id}/delete(id=${post.id})}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content Body -->
    <div class="item-body" th:text="${post.content}">
        내용
    </div>

    <!-- Actions (Equal sized buttons) -->
    <div class="action-bar">
        <div class="action-left">
            <a th:href="@{/community}" class="btn-minimal btn-minimal-light">목록</a>
        </div>

        <div class="action-center">
            <form th:action="@{/community/post/{id}/like(id=${post.id})}" method="post">
                <button type="submit" class="btn-minimal btn-minimal-like">
                    <span class="like-icon">♥</span>
                    <strong th:text="${post.likeCount}">0</strong>
                </button>
            </form>
        </div>

        <div class="action-right"></div>
    </div>

    <!-- Comments Section -->
    <div class="comments-section">

        <div th:if="${comments.isEmpty()}" class="py-4 text-center text-muted" style="font-size: 0.9rem;">
            댓글이 없습니다
        </div>

        <div th:each="comment : ${comments.content}" class="comment-item">
            <div class="comment-header-row">
                <strong class="comment-writer" th:text="${comment.writer.username}">작성자</strong>
                <span class="comment-date" th:text="${#temporals.format(comment.createdDate, 'yyyy.MM.dd HH:mm')}">2026.07.27 16:00</span>

                <div class="comment-more-wrap">
                    <div class="dropdown" th:if="${loginMember != null and ((comment.writer != null and loginMember.id == comment.writer.id) or (loginMember.memberType != null and loginMember.memberType.name() == 'ADMIN'))}">
                        <button class="dropdown-toggle-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            •••
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-apple">
                            <li>
                                <form th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger" onclick="return confirm('댓글을 삭제하시겠습니까?');">삭제</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="comment-content" th:text="${comment.content}">
                댓글
            </div>
        </div>

        <!-- Comment Input -->
        <div class="comment-write" th:if="${loginMember != null}">
            <form method="post" th:action="@{/comment/{id}/add(id=${post.id})}">
                <input type="hidden" name="postId" th:value="${post.id}"/>
                <textarea name="content" rows="3" class="form-control comment-textarea" placeholder="댓글을 남겨주세요"></textarea>
                <div class="text-end mt-3">
                    <button class="btn-minimal btn-minimal-dark" type="submit">등록</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pagination -->
    <div class="mt-4 d-flex justify-content-center" th:if="${comments.totalPages > 1}">
        <ul class="pagination apple-pagination gap-1">
            <li class="page-item" th:classappend="${comments.first} ? 'disabled'">
                <a class="page-link" th:href="@{/community/post/{id}(id=${post.id}, page=${comments.number - 1})}">&lt;</a>
            </li>

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, comments.totalPages - 1)}"
                th:classappend="${pageNumber == comments.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/community/post/{id}(id=${post.id}, page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${comments.last} ? 'disabled'">
                <a class="page-link" th:href="@{/community/post/{id}(id=${post.id}, page=${pageNumber})}">&gt;</a>
            </li>
        </ul>
    </div>

</div>

</body>
</html>
