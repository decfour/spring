<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Page</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/my.css}">
</head>

<body class="theme" data-view="member-myPage">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="page-head">
        <h2 class="page-title m-0">
            My <span class="subtitle">Page</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div class="account-section">
        <div class="panel">
            <div class="profile-row">
                <span class="profile-label">이름</span>
                <span class="profile-value" th:text="${member.name}">홍길동</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">등급</span>
                <span class="profile-value" th:text="${member.memberType}">USER</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">ID</span>
                <span class="profile-value" th:text="${member.signInId}">memberid</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Email</span>
                <span class="profile-value" th:text="${member.email}">user@example.com</span>
            </div>
        </div>

        <div class="action-grid">
            <a th:href="@{/member/my-course}" class="panel action-card">
                내 코스
            </a>
            <a th:href="@{/member/my-item}" class="panel action-card">
                내 상품
            </a>
            <a th:href="@{/member/my-review}" class="panel action-card">
                내 후기
            </a>
            <a th:href="@{/member/my-order}" class="panel action-card">
                내 주문
            </a>
        </div>
    </div>

</div>

</body>
</html>
