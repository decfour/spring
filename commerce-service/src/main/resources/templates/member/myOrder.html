<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Order</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .order-section {
            margin-top: 36px;
        }

        .order-empty {
            padding: 40px 20px;
            text-align: center;
            color: #86868b;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-card {
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .order-card:hover {
            border-color: #0066cc;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.12);
        }

        .order-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .order-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #1d1d1f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-count {
            color: #86868b;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .order-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #86868b;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .order-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .status-badge-order {
            color: #1d1d1f;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #f5f5f7;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #d2d2d7;
        }

        .status-badge-cancel {
            color: #86868b;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #ffffff;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #e5e5e7;
        }

        .btn-cancel-action {
            background: none;
            border: 1px solid #de363a;
            color: #de363a;
            border-radius: 980px;
            font-size: 0.8rem;
            padding: 3px 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.2;
        }

        .btn-cancel-action:hover {
            background-color: #de363a;
            color: #ffffff;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            My <span class="text-muted" style="font-weight:400;">Order</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-apple-outline">마이페이지</a>
        </div>
    </div>

    <div class="order-section">
        <div th:if="${#lists.isEmpty(orders)}" class="order-empty">
            주문 내역이 없습니다
        </div>

        <div th:if="${not #lists.isEmpty(orders)}" class="order-list">
            <div th:each="order : ${orders}" class="order-card">

                <div class="order-info">
                    <div class="order-title">
                        <span th:text="${order.orderItems[0].item.name}">상품명</span>
                        <span th:if="${order.orderItems.size() > 1}"
                              th:text="' 외 ' + ${order.orderItems.size() - 1} + '건'"
                              class="order-count"> 외 1건</span>
                    </div>
                    <div class="order-meta">
                        <span>주문번호: <span th:text="${order.id}">1</span></span>
                        <span>•</span>
                        <span th:text="${#numbers.formatInteger(order.getTotalPrice(), 0, 'COMMA')} + '원'">10,000원</span>
                        <span>•</span>
                        <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2026-05-24 14:00</span>
                    </div>
                </div>

                <div class="order-right">
                    <span th:if="${order.status.name() == 'ORDER'}" class="status-badge-order">주문 완료</span>
                    <span th:unless="${order.status.name() == 'ORDER'}" class="status-badge-cancel">주문 취소</span>

                    <form th:if="${order.status.name() == 'ORDER'}"
                          th:action="@{/order/{id}/cancel (id=${order.id})}"
                          method="post"
                          class="m-0 d-inline-block">
                        <button type="submit" class="btn-cancel-action" onclick="return confirm('정말 취소하시겠습니까?');">취소</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
