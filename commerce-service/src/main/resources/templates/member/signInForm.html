<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Sign In</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>
<body data-view="member-signInForm">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="auth-container">
    <h2 class="page-title mb-4 text-center">Sign In</h2>

    <form th:action="@{/member/sign-in}" th:object="${signInForm}" method="post">
        <input type="hidden" name="redirectURL" th:value="${redirectURL}" />

        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
            <p class="text-danger small m-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">글로벌 오류 메시지</p>
        </div>

        <div class="field-group">
            <label for="signInId" class="field-label">아이디</label>
            <input type="text" id="signInId" th:field="*{signInId}" class="field" th:errorclass="is-invalid" placeholder="Enter your ID" autofocus>
            <div class="invalid-feedback mb-2" th:errors="*{signInId}">아이디를 입력하세요</div>
        </div>
        <div class="field-group">
            <label for="password" class="field-label">비밀번호</label>
            <input type="password" id="password" th:field="*{signInPassword}" class="field" th:errorclass="is-invalid" placeholder="Enter your password">
            <div class="invalid-feedback mb-2" th:errors="*{signInPassword}">비밀번호를 입력하세요</div>
        </div>

        <button class="btn-action" type="submit">Sign In</button>
    </form>

    <div class="auth-link-box">
        <span class="text-muted">계정이 없으신가요?</span>
        <a href="/member/sign-on" class="auth-link">Sign On</a>
    </div>
</div>

</body>
</html>
