<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Sign In</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="theme auth" data-view="member-signInForm">

<main class="auth-layout">
<section class="auth-page panel">
    <h2 class="page-title mb-4 text-center">Sign In</h2>

    <form th:action="@{/member/sign-in}" th:object="${signInForm}" method="post">
        <input type="hidden" name="redirectURL" th:value="${redirectURL}" />

        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
            <p class="text-danger small m-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">글로벌 오류 메시지</p>
        </div>

        <div class="field-group">
            <label for="signInId" class="field-label">아이디</label>
            <input type="text" id="signInId" th:field="*{signInId}" class="field" th:errorclass="is-invalid" placeholder="아이디" autocomplete="username" autofocus>
            <div class="field-feedback mb-2" th:errors="*{signInId}">아이디를 입력하세요</div>
        </div>
        <div class="field-group">
            <label for="password" class="field-label">비밀번호</label>
            <input type="password" id="password" th:field="*{signInPassword}" class="field" th:errorclass="is-invalid" placeholder="비밀번호" autocomplete="current-password">
            <div class="field-feedback mb-2" th:errors="*{signInPassword}">비밀번호를 입력하세요</div>
        </div>

        <button class="btn-action btn-primary" type="submit">Sign In</button>
    </form>

    <div class="auth-footer">
        <span >계정이 없으신가요?</span>
        <a href="/member/sign-up" class="auth-link">Sign Up</a>
    </div>
    <div class="mt-3 text-center">
        <a th:href="@{/}" class="btn-action">홈으로</a>
    </div>
</section>
</main>

</body>
</html>
