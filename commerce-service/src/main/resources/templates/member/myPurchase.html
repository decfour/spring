<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Purchase</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>

<body data-view="member-myPurchase">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            My <span class="subtitle">Purchase</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-secondary">마이페이지</a>
        </div>
    </div>

    <div class="account-section">

        <div th:if="${purchases == null or purchases.isEmpty()}" class="empty">
            주문 내역이 없습니다
        </div>

        <div th:if="${purchases != null and !purchases.isEmpty()}" class="account-list">

            <div th:each="purchase : ${purchases}" class="account-card">

                <div class="account-info">

                    <div class="account-title">
                    <span th:text="${purchase.purchaseItems[0].item.name}">
                        상품명
                    </span>

                        <span th:if="${purchase.purchaseItems.size() > 1}"
                              th:text="${'외 ' + (purchase.purchaseItems.size() - 1) + '건'}"
                              class="purchase-count">
                            외 1건
                        </span>
                    </div>

                    <div class="account-meta">
                    <span>
                        주문번호:
                        <span th:text="${purchase.id}">1</span>
                    </span>

                        <span>•</span>

                        <span th:text="${#numbers.formatInteger(purchase.getTotalPrice(), 0, 'COMMA')} + '원'">
                        10,000원
                    </span>

                        <span>•</span>

                        <span th:text="${#temporals.format(purchase.createdAt, 'yyyy-MM-dd HH:mm')}">
                        2026-05-24 14:00
                    </span>
                    </div>

                </div>

                <div class="account-right">

                <span th:if="${purchase.status.name() == 'ORDER'}"
                      class="status-badge-purchase">
                    주문 완료
                </span>

                    <span th:unless="${purchase.status.name() == 'ORDER'}"
                          class="status-badge-cancel">
                    주문 취소
                </span>

                    <form th:if="${purchase.status.name() == 'ORDER'}"
                          th:action="@{/order/{id}/cancel(id=${purchase.id})}"
                          method="post"
                          class="m-0 d-inline-block">

                        <button type="submit"
                                class="btn-cancel"
                                onclick="return confirm('정말 취소하시겠습니까?');">
                            취소
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- 페이지네이션 -->
        <div th:if="${purchases != null and purchases.totalPages > 1}"
             class="pager">

            <nav>
                <ul class="pagination mb-0">

                    <!-- 이전 -->
                    <li class="page-item"
                        th:classappend="${purchases.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/member/my-order(page=${purchases.number - 1})}">
                            &lsaquo;
                        </a>

                    </li>

                    <!-- 페이지 번호 -->
                    <li th:each="pageNum : ${#numbers.sequence(0, purchases.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${pageNum == purchases.number} ? 'active'">

                        <a class="page-link"
                           th:href="@{/member/my-order(page=${pageNum})}"
                           th:text="${pageNum + 1}">
                            1
                        </a>

                    </li>

                    <!-- 다음 -->
                    <li class="page-item"
                        th:classappend="${purchases.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/member/my-order(page=${purchases.number + 1})}">
                            &rsaquo;
                        </a>

                    </li>

                </ul>
            </nav>

        </div>

    </div>

</div>

</body>
</html>
