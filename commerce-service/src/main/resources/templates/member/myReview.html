<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - My Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .product-table th {
            padding: 14px 0;
            font-weight: 500;
            color: #86868b;
            font-size: 0.85rem;
            border-bottom: 1px solid #d2d2d7;
        }
        .product-table td {
            padding: 18px 0;
            border-bottom: 1px solid #e5e5e7;
            font-size: 0.95rem;
        }
        .product-link {
            color: #1d1d1f;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: -0.2px;
            transition: color 0.2s;
        }
        .product-link:hover {
            color: #0066cc;
        }
        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }
        .empty-products {
            text-align: center;
            padding: 60px 0;
            color: #86868b;
            font-size: 0.95rem;
            border-top: 1px solid #d2d2d7;
            border-bottom: 1px solid #e5e5e7;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">My <span class="text-muted" style="font-weight:400;">Review</span></h2>
        <a th:href="@{/member/my-page}" class="btn-apple-outline">마이페이지</a>
    </div>

    <table th:if="${myReviews != null and !myReviews.isEmpty()}" class="product-table">
        <thead>
        <tr>
            <th style="width: 10%; text-align: center;">ID</th>
            <th style="width: 40%; text-align: center;">Product</th>
            <th style="width: 50%; text-align: center;">Title</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="review : ${myReviews}">
            <td th:text="${review.id}" style="width: 10%; color: #86868b; text-align: center;">1</td>

            <td style="width: 40%; text-align: center;">
                <a th:href="@{/shop/item/{itemId}/review/{reviewId}(itemId=${review.item.id}, reviewId=${review.id})}"
                   th:text="${review.item.name}"
                   class="product-link">상품명</a>
            </td>

            <td th:text="${review.title}" style="width: 50%; text-align: center; color: #1d1d1f;">제목</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${myReviews == null or myReviews.isEmpty()}" class="empty-products">
        작성한 리뷰가 없습니다
    </div>
</div>

</body>
</html>
