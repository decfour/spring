<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Review</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>

<body data-view="member-myReview">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="page-head">
        <h2 class="page-title m-0">
            My <span class="subtitle">Review</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-action">마이페이지</a>
        </div>
    </div>

    <div class="account-section">

        <div th:if="${myReviews == null or myReviews.isEmpty()}"
             class="empty">
            작성한 리뷰가 없습니다
        </div>

        <div th:if="${myReviews != null and !myReviews.isEmpty()}"
             class="account-list">

            <a th:each="review : ${myReviews}"
               th:href="@{/shop/item/{itemId}/review/{reviewId}(itemId=${review.item.id}, reviewId=${review.id})}"
               class="surface-card account-card">

                <div class="account-info">

                    <div class="account-title"
                         th:text="${review.title}">
                        리뷰 제목
                    </div>

                    <div class="account-meta">

                    <span>
                        ID:
                        <span th:text="${review.id}">1</span>
                    </span>

                        <span>•</span>

                        <span class="review-item-name"
                              th:text="${review.item.name}">
                        상품명
                    </span>

                    </div>

                </div>

            </a>

        </div>

        <!-- 페이지네이션 -->
        <div th:replace="~{common/pagination :: pager(${myReviews}, @{/member/my-review})}"></div>

    </div>

</div>

</body>
</html>
