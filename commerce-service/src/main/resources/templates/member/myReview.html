<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Review</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .review-section {
            margin-top: 36px;
        }

        .review-empty {
            padding: 40px 20px;
            text-align: center;
            color: #86868b;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-card {
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }

        .review-card:hover {
            border-color: #0066cc;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.12);
        }

        .review-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .review-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #1d1d1f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .review-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #86868b;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .review-item-name {
            color: #0066cc;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            My <span class="text-muted" style="font-weight:400;">Review</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-apple-outline">마이페이지</a>
        </div>
    </div>

    <div class="review-section">
        <div th:if="${myReviews == null or myReviews.isEmpty()}" class="review-empty">
            작성한 리뷰가 없습니다
        </div>

        <div th:if="${myReviews != null and !myReviews.isEmpty()}" class="review-list">
            <a th:each="review : ${myReviews}"
               th:href="@{/shop/item/{itemId}/review/{reviewId}(itemId=${review.item.id}, reviewId=${review.id})}"
               class="review-card">

                <div class="review-info">
                    <div class="review-title" th:text="${review.title}">리뷰 제목</div>
                    <div class="review-meta">
                        <span>ID: <span th:text="${review.id}">1</span></span>
                        <span>•</span>
                        <span class="review-item-name" th:text="${review.item.name}">상품명</span>
                    </div>
                </div>

            </a>
        </div>
    </div>

</div>

</body>
</html>
