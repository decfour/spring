<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - Sign On</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>
<body data-view="member-signOnForm">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="auth-container">
    <h2 class="page-title mb-4 text-center">Sign On</h2>

    <form th:action="@{/member/sign-on}" th:object="${member}" method="post">

        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
            <p class="text-danger small m-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류 메시지</p>
        </div>

        <div class="mb-3">
            <label for="name" class="field-label">이름</label>
            <input type="text" id="name" th:field="*{name}" class="field" th:errorclass="is-invalid" placeholder="Your name">
            <div class="invalid-feedback mt-1" th:errors="*{name}">이름 오류</div>
        </div>

        <div class="mb-3">
            <label for="email" class="field-label">이메일</label>
            <input type="email" id="email" th:field="*{email}" class="field" th:errorclass="is-invalid" placeholder="Your Email">
            <div class="invalid-feedback mt-1" th:errors="*{email}">이메일 오류</div>
        </div>

        <div class="mb-3">
            <label for="signInId" class="field-label">아이디</label>
            <input type="text" id="signInId" th:field="*{signInId}" class="field" th:errorclass="is-invalid" placeholder="Your ID">
            <div class="invalid-feedback mt-1" th:errors="*{signInId}">아이디 오류</div>
        </div>

        <div class="field-group">
            <label for="password" class="field-label">비밀번호</label>
            <input type="password" id="password" th:field="*{signInPassword}" class="field" th:errorclass="is-invalid" placeholder="Password">
            <div class="invalid-feedback mt-1" th:errors="*{signInPassword}">비밀번호 오류</div>
        </div>

        <button class="btn-action" type="submit">Sign On</button>
    </form>

    <div class="auth-link-box">
        <span class="text-muted">계정이 있으신가요?</span>
        <a href="/member/sign-in" class="auth-link">Sign In</a>
    </div>
</div>

</body>
</html>
