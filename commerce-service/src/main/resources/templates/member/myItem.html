<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>THGTE - My Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .product-table th {
            padding: 14px 0;
            font-weight: 500;
            color: #86868b;
            font-size: 0.85rem;
            border-bottom: 1px solid #d2d2d7;
        }
        .product-table td {
            padding: 18px 0;
            border-bottom: 1px solid #e5e5e7;
            font-size: 0.95rem;
        }
        .product-link {
            color: #1d1d1f;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: -0.2px;
            transition: color 0.2s;
        }
        .product-link:hover {
            color: #0066cc;
        }
        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }
        .soldout-badge {
            color: #de363a;
            font-weight: 500;
            font-size: 0.85rem;
            background-color: #fdf2f2;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #f8d7da;
        }
        .status-badge-open {
            color: #1d1d1f;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #f5f5f7;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #d2d2d7;
            display: inline-block;
        }
        .status-badge-closed {
            color: #86868b;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #ffffff;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #e5e5e7;
            display: inline-block;
        }
        .empty-products {
            text-align: center;
            padding: 60px 0;
            color: #86868b;
            font-size: 0.95rem;
            border-top: 1px solid #d2d2d7;
            border-bottom: 1px solid #e5e5e7;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">My <span class="text-muted" style="font-weight:400;">Product</span></h2>
        <a th:href="@{/member/my-page}" class="btn-apple-outline">마이페이지</a>
    </div>

    <table th:if="${myItems != null and !myItems.isEmpty()}" class="product-table">
        <thead>
        <tr>
            <th style="width: 10%; text-align: center;">ID</th>
            <th style="width: 40%; text-align: center;">Product</th>
            <th style="width: 15%; text-align: center;">Price</th>
            <th style="width: 15%; text-align: center;">Stock</th>
            <th style="width: 20%; text-align: center;">Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${myItems}">
            <td th:text="${item.id}" style="width: 10%; color: #86868b; text-align: center;">1</td>
            <td style="width: 40%; text-align: center;">
                <a th:href="@{/shop/item/{itemId}(itemId=${item.id})}" th:text="${item.name}" class="product-link">내 등록 상품</a>
            </td>
            <td th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'" style="width: 15%; color: #424245; text-align: center;">10,000원</td>
            <td style="width: 15%; text-align: center;">
                <span th:if="${item.stock > 0}" th:text="${item.stock} + '개'" style="color: #1d1d1f;">5개</span>
                <span th:unless="${item.stock > 0}" class="soldout-badge">품절</span>
            </td>
            <td style="width: 20%; text-align: center;">
                <span th:if="${item.open}" class="status-badge-open">판매 중</span>
                <span th:unless="${item.open}" class="status-badge-closed">판매 중지</span>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${myItems == null or myItems.isEmpty()}" class="empty-products">
        등록된 상품이 없습니다
    </div>
</div>

</body>
</html>
