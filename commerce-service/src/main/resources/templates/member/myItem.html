<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .product-section {
            margin-top: 36px;
        }

        .product-empty {
            padding: 40px 20px;
            text-align: center;
            color: #86868b;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 14px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }

        .product-card:hover {
            border-color: #0066cc;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.12);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .product-name {
            font-size: 0.98rem;
            font-weight: 600;
            color: #1d1d1f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #86868b;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .product-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .soldout-badge {
            color: #de363a;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #fdf2f2;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #f8d7da;
        }

        .status-badge-open {
            color: #1d1d1f;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #f5f5f7;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #d2d2d7;
        }

        .status-badge-closed {
            color: #86868b;
            font-weight: 500;
            font-size: 0.8rem;
            background-color: #ffffff;
            padding: 3px 10px;
            border-radius: 980px;
            border: 1px solid #e5e5e7;
        }

        .pagination-wrap {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .pagination {
            gap: 6px;
        }

        .page-link {
            border: 1px solid #d2d2d7;
            border-radius: 8px !important;
            color: #1d1d1f;
            background-color: #ffffff;
            min-width: 36px;
            text-align: center;
        }

        .page-link:hover {
            background-color: #f5f5f7;
            color: #0066cc;
        }

        .page-item.active .page-link {
            background-color: #1d1d1f;
            border-color: #1d1d1f;
            color: #ffffff;
        }

        .page-item.disabled .page-link {
            color: #86868b;
            background-color: #ffffff;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            My <span class="text-muted" style="font-weight:400;">Product</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-apple-outline">마이페이지</a>
        </div>
    </div>

    <div class="product-section">

        <!-- 등록한 상품이 없는 경우 -->
        <div th:if="${myItems == null or myItems.isEmpty()}"
             class="product-empty">
            등록된 상품이 없습니다
        </div>

        <!-- 등록한 상품이 있는 경우 -->
        <div th:if="${myItems != null and !myItems.isEmpty()}"
             class="product-list">

            <a th:each="item : ${myItems}"
               th:href="@{/shop/item/{itemId}(itemId=${item.id})}"
               class="product-card">

                <div class="product-info">

                    <div class="product-name"
                         th:text="${item.name}">
                        내 등록 상품
                    </div>

                    <div class="product-meta">

                        <span>
                            ID:
                            <span th:text="${item.id}">1</span>
                        </span>

                        <span>•</span>

                        <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">
                            10,000원
                        </span>

                        <span>•</span>

                        <span th:if="${item.stock > 0}"
                              th:text="${item.stock} + '개'">
                            5개
                        </span>

                        <span th:unless="${item.stock > 0}"
                              class="soldout-badge">
                            품절
                        </span>

                    </div>

                </div>

                <div class="product-right">

                    <span th:if="${item.open}"
                          class="status-badge-open">
                        판매 중
                    </span>

                    <span th:unless="${item.open}"
                          class="status-badge-closed">
                        판매 중지
                    </span>

                </div>

            </a>

        </div>

        <!-- 페이지네이션 -->
        <div th:if="${myItems != null and myItems.totalPages > 1}"
             class="pagination-wrap">

            <nav>
                <ul class="pagination mb-0">

                    <!-- 이전 -->
                    <li class="page-item"
                        th:classappend="${myItems.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/member/my-item(page=${myItems.number - 1})}">
                            &lsaquo;
                        </a>

                    </li>

                    <!-- 페이지 번호 -->
                    <li th:each="pageNum : ${#numbers.sequence(0, myItems.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${pageNum == myItems.number} ? 'active'">

                        <a class="page-link"
                           th:href="@{/member/my-item(page=${pageNum})}"
                           th:text="${pageNum + 1}">
                            1
                        </a>

                    </li>

                    <!-- 다음 -->
                    <li class="page-item"
                        th:classappend="${myItems.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/member/my-item(page=${myItems.number + 1})}">
                            &rsaquo;
                        </a>

                    </li>

                </ul>
            </nav>

        </div>

    </div>

</div>

</body>
</html>
