<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Item</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>

<body data-view="member-myItem">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            My <span class="subtitle">Product</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-action">마이페이지</a>
        </div>
    </div>

    <div class="account-section">

        <!-- 등록한 상품이 없는 경우 -->
        <div th:if="${myItems == null or myItems.isEmpty()}"
             class="empty">
            등록된 상품이 없습니다
        </div>

        <!-- 등록한 상품이 있는 경우 -->
        <div th:if="${myItems != null and !myItems.isEmpty()}"
             class="account-list">

            <a th:each="item : ${myItems}"
               th:href="@{/shop/item/{itemId}(itemId=${item.id})}"
               class="surface-card account-card">

                <div class="account-info">

                    <div class="account-title"
                         th:text="${item.name}">
                        내 등록 상품
                    </div>

                    <div class="account-meta">

                        <span>
                            ID:
                            <span th:text="${item.id}">1</span>
                        </span>

                        <span>•</span>

                        <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">
                            10,000원
                        </span>

                        <span>•</span>

                        <span th:if="${item.stock > 0}"
                              th:text="${item.stock} + '개'">
                            5개
                        </span>

                        <span th:unless="${item.stock > 0}"
                              class="soldout-badge">
                            품절
                        </span>

                    </div>

                </div>

                <div class="account-right">

                    <span th:if="${item.open}"
                          class="status-badge-open">
                        판매 중
                    </span>

                    <span th:unless="${item.open}"
                          class="status-badge-closed">
                        판매 중지
                    </span>

                </div>

            </a>

        </div>

        <!-- 페이지네이션 -->
        <div th:if="${myItems != null and myItems.totalPages > 1}"
             class="pager">

            <nav>
                <ul class="pagination mb-0">

                    <!-- 이전 -->
                    <li class="page-item"
                        th:classappend="${myItems.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/member/my-item(page=${myItems.number - 1})}">
                            &lsaquo;
                        </a>

                    </li>

                    <!-- 페이지 번호 -->
                    <li th:each="pageNum : ${#numbers.sequence(0, myItems.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${pageNum == myItems.number} ? 'active'">

                        <a class="page-link"
                           th:href="@{/member/my-item(page=${pageNum})}"
                           th:text="${pageNum + 1}">
                            1
                        </a>

                    </li>

                    <!-- 다음 -->
                    <li class="page-item"
                        th:classappend="${myItems.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/member/my-item(page=${myItems.number + 1})}">
                            &rsaquo;
                        </a>

                    </li>

                </ul>
            </nav>

        </div>

    </div>

</div>

</body>
</html>
