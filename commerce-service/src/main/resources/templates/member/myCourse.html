<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - My Course</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>

<body data-view="member-myCourse">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="page-head">
        <h2 class="page-title m-0">
            My <span class="subtitle">Course</span>
        </h2>

        <div class="d-flex gap-2">
            <a th:href="@{/member/my-page}" class="btn-action">마이페이지</a>
        </div>
    </div>

    <div class="account-section">

        <!-- 등록한 코스가 없는 경우 -->
        <div th:if="${myCourses == null or myCourses.isEmpty()}"
             class="empty">
            등록한 산책 코스가 없습니다
        </div>

        <!-- 등록한 코스가 있는 경우 -->
        <div th:if="${myCourses != null and !myCourses.isEmpty()}"
             class="account-list">

            <a th:each="course : ${myCourses}"
               th:href="@{/walk/course/{courseId}(courseId=${course.id})}"
               class="surface-card account-card">

                <div class="account-info">

                    <div class="account-title"
                         th:text="${course.title}">
                        산책 코스 이름
                    </div>

                    <div class="account-meta">
                        <span>ID: <span class="course-id"
                                        th:text="${course.id}">1</span></span>

                        <span>•</span>

                        <span th:text="${course.distance + 'm'}">
                            1200m
                        </span>

                        <span>•</span>

                        <span th:text="${#temporals.format(course.createdAt, 'yyyy.MM.dd')}">
                            2026.08.19
                        </span>

                    </div>

                </div>

            </a>

        </div>

        <div th:replace="~{common/pagination :: pager(${myCourses}, @{/member/my-course})}"></div>

    </div>

</div>

</body>
</html>
