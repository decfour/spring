<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Notice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Base Styles */
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .detail-container {
            max-width: 680px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* Detail Header */
        .detail-header {
            margin-bottom: 24px;
        }
        .notice-meta {
            font-size: 0.85rem;
            color: #86868b;
            margin-bottom: 12px;
        }
        .notice-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        .notice-author-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            padding-bottom: 24px;
            min-height: 38px;
        }
        .notice-author-bar .author-name {
            color: #1d1d1f;
            font-weight: 600;
        }

        /* Content Body */
        .notice-body {
            border-top: 1px solid #1d1d1f;
            border-bottom: 1px solid #e5e5e7;
            padding: 40px 10px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #333336;
            white-space: pre-wrap;
            min-height: 240px;
        }

        /* Action Buttons Area */
        .action-bar {
            display: flex;
            align-items: center;
            margin: 32px 0;
        }
        .action-left { flex: 1; display: flex; justify-content: flex-start; }

        /* Unified Minimal Buttons */
        .btn-minimal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }
        /* 목록 버튼 (Light Gray Standard) */
        .btn-minimal-light {
            background-color: #f5f5f7;
            color: #1d1d1f;
            border: none;
        }
        .btn-minimal-light:hover {
            background-color: #e8e8ed;
            color: #1d1d1f;
        }

        /* Dropdown Icon Menu */
        .dropdown-toggle-icon {
            background: none;
            border: none;
            color: #86868b;
            font-size: 1.1rem;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .dropdown-toggle-icon:hover {
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .dropdown-menu-apple {
            border-radius: 12px;
            border: 1px solid #e5e5e7;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 6px;
            min-width: 100px;
        }
        .dropdown-menu-apple .dropdown-item {
            font-size: 0.85rem;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 500;
        }
        .dropdown-menu-apple .dropdown-item.text-danger:hover {
            background-color: #fff2f2;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="detail-container">

    <!-- Header Area -->
    <div class="detail-header">
        <div class="notice-meta">
            <span>공지사항</span> •
            <span th:text="${#temporals.format(notice.createdDate, 'yyyy년 MM월 dd일 HH:mm')}">2026년 06월 04일 09:20</span>
        </div>

        <h1 class="notice-title" th:text="${notice.title}">제목</h1>

        <div class="notice-author-bar">
            <span class="author-name">관리자</span>

            <!-- 관리자 전용 더보기 옵션 드롭다운 -->
            <div class="dropdown" th:if="${member != null and member.memberType?.name() == 'ADMIN'}">
                <button class="dropdown-toggle-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    •••
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-apple">
                    <li>
                        <a class="dropdown-item" th:href="@{/notice/{id}/edit(id=${notice.id})}">수정</a>
                    </li>
                    <li>
                        <form th:action="@{/notice/{id}/delete(id=${notice.id})}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Content Body -->
    <div class="notice-body" th:text="${notice.content}">
        내용
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
        <div class="action-left">
            <a th:href="@{/notice}" class="btn-minimal btn-minimal-light">목록</a>
        </div>
    </div>

</div>

</body>
</html>
