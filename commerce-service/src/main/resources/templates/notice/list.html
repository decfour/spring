<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Notice</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>
<body data-view="notice-list">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">
    <div class="page-head">
        <h2 class="page-title m-0">Notice</h2>
        <div class="d-flex gap-2">
            <a th:if="${member != null && member.memberType.name() == 'ADMIN'}" th:href="@{/notice/add}" class="btn-action">등록</a>
            <a th:href="@{/}" class="btn-action">뒤로</a>
        </div>
    </div>

    <div th:if="${notices.isEmpty()}" class="empty">
        공지사항이 없습니다
    </div>

    <table th:if="${not notices.isEmpty()}" class="data-table">
        <thead>
        <tr>
            <th style="width: 75%; text-align: left;">Title</th>
            <th style="width: 25%; text-align: right;">Date</th>
        </tr>
        </thead>
        <tbody>
        <tr class="entry-row" th:each="notice : ${notices}">
            <td>
                <a th:href="@{/notice/{id}(id=${notice.id})}" th:text="${notice.title}" class="entry-link">[안내] 공지사항 제목</a>
            </td>
            <td th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}" class="entry-date">2026.08.13</td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{common/pagination :: pager(${notices}, @{/notice})}"></div>
</div>

</body>
</html>
