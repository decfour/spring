<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">

    <title th:text="${isEdit ?: false} ? 'THGTE - Edit Notice' : 'THGTE - Add Notice'">
        THGTE - Add Notice
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .form-label-custom {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-apple {
            width: 100%;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #1d1d1f;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-apple:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        .form-control-apple::placeholder {
            color: #86868b;
        }

        .form-control-apple.field-error {
            border-color: #ff3b30;
        }

        .form-control-apple.field-error:focus {
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.15);
        }

        .field-error-text {
            color: #ff3b30;
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: 500;
        }

        .btn-apple-dark,
        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
        }

        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: 1px solid #1d1d1f;
        }

        .btn-apple-dark:hover {
            background-color: #434344;
            border-color: #434344;
            color: #ffffff;
        }

        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            Notice <span class="text-muted" style="font-weight:400;" th:text="${isEdit ?: false} ? 'Edit' : 'Add'">Add</span>
        </h2>
    </div>

    <form th:action th:object="${noticeForm}" method="post">

        <input type="hidden"
               th:if="${isEdit ?: false}"
               th:field="*{id}">

        <div class="mb-4">
            <label for="title" class="form-label-custom">제목</label>

            <input type="text"
                   id="title"
                   th:field="*{title}"
                   class="form-control-apple"
                   placeholder="공지사항 제목을 입력하세요"
                   maxlength="30"
                   th:classappend="${#fields.hasErrors('title')} ? 'field-error' : ''">

            <div class="field-error-text"
                 th:errors="*{title}">
            </div>
        </div>

        <div class="mb-4">
            <label for="content" class="form-label-custom">본문 내용</label>

            <textarea id="content"
                      th:field="*{content}"
                      rows="10"
                      class="form-control-apple"
                      placeholder="공지사항 내용을 작성하세요..."
                      style="resize: none;"
                      th:classappend="${#fields.hasErrors('content')} ? 'field-error' : ''"></textarea>

            <div class="field-error-text"
                 th:errors="*{content}">
            </div>
        </div>

        <div class="d-flex gap-2 justify-content-end align-items-center mt-4">

            <button type="button"
                    class="btn-apple-outline"
                    th:if="${isEdit ?: false}"
                    th:onclick="|location.href='@{/notice/{id}(id=${noticeForm.id})}'|">
                취소
            </button>

            <button type="button"
                    class="btn-apple-outline"
                    th:unless="${isEdit ?: false}"
                    th:onclick="|location.href='@{/notice}'|">
                취소
            </button>

            <button type="submit"
                    class="btn-apple-dark"
                    th:text="${isEdit ?: false} ? '수정' : '등록'">
                등록
            </button>

        </div>

    </form>

</div>

</body>
</html>
