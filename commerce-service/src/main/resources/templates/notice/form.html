<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">

    <title th:text="${isEdit ?: false} ? 'THGTE - Edit Notice' : 'THGTE - Add Notice'">
        THGTE - Add Notice
    </title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>

<body data-view="notice-form">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">
            Notice <span class="subtitle" th:text="${isEdit ?: false} ? 'Edit' : 'Add'">Add</span>
        </h2>
    </div>

    <form th:action th:object="${noticeForm}" method="post">

        <input type="hidden"
               th:if="${isEdit ?: false}"
               th:field="*{id}">

        <div class="field-group">
            <label for="title" class="field-label">제목</label>

            <input type="text"
                   id="title"
                   th:field="*{title}"
                   class="field"
                   placeholder="공지사항 제목을 입력하세요"
                   maxlength="30"
                   th:classappend="${#fields.hasErrors('title')} ? 'field-error' : ''">

            <div class="field-error-text"
                 th:errors="*{title}">
            </div>
        </div>

        <div class="field-group">
            <label for="content" class="field-label">본문 내용</label>

            <textarea id="content"
                      th:field="*{content}"
                      rows="10"
                      class="field"
                      placeholder="공지사항 내용을 작성하세요..."

                      th:classappend="${#fields.hasErrors('content')} ? 'field-error' : ''"></textarea>

            <div class="field-error-text"
                 th:errors="*{content}">
            </div>
        </div>

        <div class="form-actions">

            <button type="button"
                    class="btn-action"
                    th:if="${isEdit ?: false}"
                    th:onclick="|location.href='@{/notice/{id}(id=${noticeForm.id})}'|">
                취소
            </button>

            <button type="button"
                    class="btn-action"
                    th:unless="${isEdit ?: false}"
                    th:onclick="|location.href='@{/notice}'|">
                취소
            </button>

            <button type="submit"
                    class="btn-action"
                    th:text="${isEdit ?: false} ? '수정' : '등록'">
                등록
            </button>

        </div>

    </form>

</div>

</body>
</html>
