<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .btn-apple-dark,
        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
        }

        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: 1px solid #1d1d1f;
        }

        .btn-apple-dark:hover {
            background-color: #434344;
            border-color: #434344;
            color: #ffffff;
        }

        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }

        .cart-empty {
            padding: 40px 20px;
            text-align: center;
            color: #86868b;
            font-size: 0.95rem;
            line-height: 1.5;
            border-top: 1px solid #d2d2d7;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .cart-table th {
            padding: 14px 0;
            font-weight: 500;
            color: #86868b;
            font-size: 0.85rem;
            border-bottom: 1px solid #d2d2d7;
        }

        .cart-table td {
            padding: 18px 0;
            border-bottom: 1px solid #e5e5e7;
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .cart-item-link {
            color: #1d1d1f;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: -0.2px;
            transition: color 0.2s ease;
        }

        .cart-item-link:hover {
            color: #0066cc;
        }

        .btn-delete-icon {
            background: none;
            border: none;
            color: #86868b;
            font-size: 1.1rem;
            padding: 2px 8px;
            border-radius: 980px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .btn-delete-icon:hover {
            background-color: #fff2f2;
            color: #de363a;
        }

        .summary-card {
            padding: 24px;
            border: 1px solid #d2d2d7;
            border-radius: 18px;
            background-color: #f5f5f7;
            margin-top: 36px;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">Cart</h2>
        <a th:href="@{/shop}" class="btn-apple-outline">상점</a>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="cart-empty">
        장바구니가 비어 있습니다
    </div>

    <div th:if="${not #lists.isEmpty(cartItems)}">
        <table class="cart-table">
            <thead>
            <tr>
                <th style="width: 40%; text-align: left; padding-left: 10px;">Product</th>
                <th style="width: 20%; text-align: center;">Price</th>
                <th style="width: 15%; text-align: center;">Quantity</th>
                <th style="width: 15%; text-align: right;">Total</th>
                <th style="width: 10%; text-align: right; padding-right: 10px;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cartItem : ${cartItems}">
                <td style="text-align: left; padding-left: 10px;">
                    <a th:href="@{/shop/item/{itemId}(itemId=${cartItem.item.id})}"
                       th:text="${cartItem.item.name}"
                       class="cart-item-link">상품명</a>
                </td>
                <td th:text="${#numbers.formatInteger(cartItem.item.price, 0, 'COMMA')} + '원'" style="text-align: center; color: #86868b;">0원</td>
                <td th:text="${cartItem.count} + '개'" style="text-align: center; color: #1d1d1f; font-weight: 500;">1개</td>
                <td th:text="${#numbers.formatInteger(cartItem.item.price * cartItem.count, 0, 'COMMA')} + '원'" class="fw-semibold" style="text-align: right;">0원</td>
                <td style="text-align: right; padding-right: 10px;">
                    <form th:action="@{/cart/item/{id}/delete(id=${cartItem.id})}" method="post" class="m-0">
                        <button type="submit" class="btn-delete-icon" title="삭제">✕</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="summary-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="color: #86868b; font-size: 0.95rem; font-weight: 500;">총 결제 금액</span>
                <span style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px;" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'">0원</span>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <form th:action="@{/order/cart}" method="post" class="m-0">
                    <button type="submit" class="btn-apple-dark">전체 주문</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
