<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Cart</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
</head>
<body data-view="cart-cartList">

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="page">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="page-title m-0">Cart</h2>
        <a th:href="@{/shop}" class="btn-secondary">상점</a>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty">
        장바구니가 비어 있습니다
    </div>

    <div th:if="${not #lists.isEmpty(cartItems)}">
        <table class="cart-table">
            <thead>
            <tr>
                <th style="width: 40%; text-align: left; padding-left: 10px;">Product</th>
                <th style="width: 20%; text-align: center;">Price</th>
                <th style="width: 15%; text-align: center;">Quantity</th>
                <th style="width: 15%; text-align: right;">Total</th>
                <th style="width: 10%; text-align: right; padding-right: 10px;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cartItem : ${cartItems}">
                <td style="text-align: left; padding-left: 10px;">
                    <a th:href="@{/shop/item/{itemId}(itemId=${cartItem.item.id})}"
                       th:text="${cartItem.item.name}"
                       class="cart-item-link">상품명</a>
                </td>
                <td th:text="${#numbers.formatInteger(cartItem.item.price, 0, 'COMMA')} + '원'" style="text-align: center; color: #86868b;">0원</td>
                <td th:text="${cartItem.quantity} + '개'" style="text-align: center; color: #1d1d1f; font-weight: 500;">1개</td>
                <td th:text="${#numbers.formatInteger(cartItem.item.price * cartItem.quantity, 0, 'COMMA')} + '원'" class="fw-semibold" style="text-align: right;">0원</td>
                <td style="text-align: right; padding-right: 10px;">
                    <form th:action="@{/cart/item/{id}/delete(id=${cartItem.id})}" method="post" class="m-0">
                        <button type="submit" class="btn-delete" title="삭제">✕</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="summary-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="color: #86868b; font-size: 0.95rem; font-weight: 500;">총 결제 금액</span>
                <span style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px;" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'">0원</span>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <form th:action="@{/order/cart}" method="get" class="m-0">
                    <button type="submit" class="btn-primary">전체 주문</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
