<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Add Order</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .sub-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1d1d1f;
        }

        .item-card {
            padding: 16px 20px;
            border: 1px solid #d2d2d7;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .form-label-custom {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-apple {
            width: 100%;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #1d1d1f;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-apple:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        .form-control-apple::placeholder {
            color: #86868b;
        }

        .summary-card {
            padding: 24px;
            border: 1px solid #d2d2d7;
            border-radius: 18px;
            background-color: #f5f5f7;
            margin-top: 36px;
        }

        .btn-apple-dark,
        .btn-apple-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
            cursor: pointer;
        }

        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: 1px solid #1d1d1f;
        }

        .btn-apple-dark:hover {
            background-color: #434344;
            border-color: #434344;
            color: #ffffff;
        }

        .btn-apple-outline {
            background-color: transparent;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-apple-outline:hover {
            background-color: #f5f5f7;
            border-color: #86868b;
            color: #1d1d1f;
        }
    </style>
</head>

<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">
            Order <span class="text-muted" style="font-weight:400;">Add</span>
        </h2>

        <a th:href="@{/shop}" class="btn-apple-outline">
            뒤로
        </a>
    </div>

    <form th:action="@{/order/create}" method="post">

        <input type="hidden" name="orderType" th:value="${orderType}">
        <input type="hidden" name="itemId" th:value="${itemId}">
        <input type="hidden" name="count" th:value="${count}">

        <div class="sub-section-title">주문 상품 정보</div>
        <div th:each="orderItem : ${orderItems}" class="item-card">
            <div class="item-row">
                <div>
                    <span th:text="${orderItem.itemName}" class="fw-semibold">상품명</span>
                    <span th:text="' x ' + ${orderItem.count} + '개'" style="color: #86868b; font-size: 0.88rem;">x 1개</span>
                </div>
                <div th:text="${#numbers.formatInteger(orderItem.orderPrice * orderItem.count, 0, 'COMMA')} + '원'" class="fw-bold">0원</div>
            </div>
        </div>

        <div class="sub-section-title">배송지 정보</div>
        <div class="mb-4">
            <label for="receiverName" class="form-label-custom">수령인</label>
            <input type="text"
                   id="receiverName"
                   name="receiverName"
                   class="form-control-apple"
                   placeholder="이름을 입력해 주세요."
                   required>
        </div>

        <div class="mb-4">
            <label for="address" class="form-label-custom">배송 주소</label>
            <input type="text"
                   id="address"
                   name="address"
                   class="form-control-apple"
                   placeholder="상세 주소를 입력해 주세요."
                   required>
        </div>

        <div class="summary-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="color: #86868b; font-size: 0.95rem; font-weight: 500;">최종 결제 금액</span>
                <span style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px;"
                      th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'">0원</span>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/shop}" class="btn-apple-outline">
                    취소
                </a>
                <button type="submit" class="btn-apple-dark">
                    주문
                </button>
            </div>
        </div>

    </form>

</div>

</body>
</html>
