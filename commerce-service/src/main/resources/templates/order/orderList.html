<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>THGTE - Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .main-container {
            max-width: 850px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .order-table th {
            padding: 14px 0;
            font-weight: 500;
            color: #86868b;
            font-size: 0.85rem;
            border-bottom: 1px solid #d2d2d7;
        }
        .order-table td {
            padding: 18px 0;
            border-bottom: 1px solid #e5e5e7;
            font-size: 0.95rem;
        }
        .btn-apple-dark {
            background-color: #1d1d1f;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            text-decoration: none;
            transition: background-color 0.2s;
            display: inline-block;
        }
        .btn-apple-dark:hover {
            background-color: #434344;
            color: #ffffff;
        }
        .status-badge-order {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            color: #1d1d1f;
            background-color: #f5f5f7;
            border: 1px solid #d2d2d7;
        }
        .status-badge-cancel {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            color: #86868b;
            background-color: #ffffff;
            border: 1px solid #e5e5e7;
        }
        .btn-table-action-danger {
            background: none;
            border: 1px solid #de363a;
            color: #de363a;
            border-radius: 4px;
            font-size: 0.75rem;
            padding: 2px 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-table-action-danger:hover {
            background-color: #de363a;
            color: #ffffff;
        }
        .empty-orders {
            text-align: center;
            padding: 60px 0;
            color: #86868b;
            font-size: 0.95rem;
            border-top: 1px solid #d2d2d7;
            border-bottom: 1px solid #e5e5e7;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: mainHeader}"></div>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="section-title m-0">My <span class="text-muted" style="font-weight:400;">Orders</span></h2>
        <a href="/member/my-page" class="btn-apple-dark">마이페이지</a>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-orders">
        주문 내역이 없습니다
    </div>

    <div th:if="${not #lists.isEmpty(orders)}" class="table-responsive">
        <table class="order-table">
            <thead>
            <tr>
                <th style="width: 10%; text-align: center;">주문 번호</th>
                <th style="width: 12%; text-align: center;">회원명</th>
                <th style="width: 33%; text-align: center;">상품명</th>
                <th style="width: 15%; text-align: center;">결제 금액</th>
                <th style="width: 15%; text-align: center;">주문 일시</th>
                <th style="width: 10%; text-align: center;">상태</th>
                <th style="width: 5%; text-align: center;">작업</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}" style="width: 10%; color: #86868b; text-align: center;">1</td>

                <td th:text="${order.member.username}" style="width: 12%; text-align: center; color: #424245;">홍길동</td>

                <td style="width: 33%; text-align: center;">
                    <span th:text="${order.orderItems[0].item.name}" class="text-dark fw-medium" style="letter-spacing: -0.2px;">상품명</span>
                    <span th:if="${order.orderItems.size() > 1}" th:text="' 외 ' + ${order.orderItems.size() - 1} + '건'" style="color: #86868b; font-size: 0.85rem;"> 외 1건</span>
                </td>

                <td th:text="${#numbers.formatInteger(order.getTotalPrice(), 0, 'COMMA')} + '원'" class="fw-medium" style="width: 15%; color: #1d1d1f; text-align: center;">10,000원</td>

                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}" style="width: 15%; color: #86868b; font-size: 0.85rem; text-align: center;">2026-05-24</td>

                <td style="width: 10%; text-align: center;">
                    <span th:if="${order.status.name() == 'ORDER'}" class="status-badge-order">주문 완료</span>
                    <span th:unless="${order.status.name() == 'ORDER'}" class="status-badge-cancel">주문 취소</span>
                </td>

                <td style="width: 5%; text-align: center;">
                    <form th:if="${order.status.name() == 'ORDER'}" th:action="@{/order/{id}/cancel (id=${order.id})}" method="post" class="m-0 d-inline-block">
                        <button type="submit" class="btn-table-action-danger" onclick="return confirm('정말 취소하시겠습니까?');">취소</button>
                    </form>
                    <span th:unless="${order.status.name() == 'ORDER'}" style="color: #d2d2d7;">-</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
