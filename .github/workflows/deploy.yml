name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 빌드
        working-directory: commerce-service
        run: ./gradlew build -x test

      - name: JAR 파일 EC2 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "commerce-service/build/libs/commerce-service-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"
          strip_components: 3

      - name: Spring 재시작
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          UPLOAD_DIR: ${{ secrets.UPLOAD_DIR }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_USERNAME,DB_PASSWORD,JWT_SECRET,UPLOAD_DIR,KAKAO_REST_API_KEY
          script: |
            PID=$(pgrep -f '^java -jar /home/ubuntu/commerce-service-0.0.1-SNAPSHOT.jar' || true)

            if [ -n "$PID" ]; then
              kill "$PID"

              for i in {1..30}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
            fi

            nohup java -jar /home/ubuntu/commerce-service-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > /home/ubuntu/app.log 2>&1 < /dev/null &